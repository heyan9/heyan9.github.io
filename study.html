<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>何岩学习网</title>
<style>
:root{--b:#0084ff;--b2:#3aa0ff;--line:rgba(0,132,255,.16);--tx:#3b4553;--sub:#8590a6;--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:var(--tx);min-height:100vh;overflow-x:hidden;position:relative}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:34px 16px 26px;min-height:100vh;display:flex;flex-direction:column}
/* 头部 */
header{text-align:center;margin-bottom:22px;animation:drop .9s cubic-bezier(.22,1,.36,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-26px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
h1{font-size:25px;font-weight:800;letter-spacing:5px;background:linear-gradient(100deg,#0066d6,#0084ff,#6fc3ff,#0084ff,#0066d6);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:-250% 0}}
.logo{display:block;margin:0 auto;height:34px;width:auto;max-width:70%}
.tools{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--b);font-size:12px;font-weight:600;padding:7px 16px;border-radius:12px;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s,color .25s,background .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 22px -8px rgba(0,132,255,.45);border-color:var(--b)}
.btn:active{transform:scale(.94)}
.btn.on{background:var(--b);color:#fff;border-color:var(--b)}
.btn.sm{padding:4px 11px;font-size:11px;border-radius:10px}
.btn.danger{color:#ff4d4f}.btn.danger:hover{border-color:#ff4d4f;box-shadow:0 10px 22px -8px rgba(255,77,79,.45)}
.rip{position:absolute;border-radius:50%;background:rgba(0,132,255,.25);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* 栏目 */
#list{display:flex;flex-direction:column;gap:16px;flex:1}
.sec{background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.85);border-radius:18px;padding:14px 16px 16px;box-shadow:0 10px 34px -14px rgba(0,132,255,.28),inset 0 0 0 1px var(--line);position:relative;overflow:hidden;opacity:0;transform:translateY(30px) scale(.97);animation:rise .8s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i)*.09s);transition:box-shadow .35s,transform .35s}
.sec::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);pointer-events:none}
.sec:hover::before{animation:sweep 1.1s ease}
.sec:hover{box-shadow:0 18px 44px -14px rgba(0,132,255,.4),inset 0 0 0 1px rgba(0,132,255,.3)}
@keyframes sweep{to{left:130%}}
@keyframes rise{to{opacity:1;transform:none}}
.sec.new{animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:none}}
.sec.out{animation:out .35s ease forwards}
@keyframes out{to{opacity:0;transform:scale(.88) translateY(-10px)}}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sh .dot{width:6px;height:6px;border-radius:50%;background:var(--b);box-shadow:0 0 0 0 rgba(0,132,255,.5);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(0,132,255,0)}100%{box-shadow:0 0 0 0 rgba(0,132,255,0)}}
.sh b{font-size:14px;font-weight:700}
.sh i{font-style:normal;font-size:11px;color:var(--sub)}
.sh .sp{flex:1}
.edit-only{display:none}
body.editing .edit-only{display:inline-block}
.sites{display:flex;flex-wrap:wrap;gap:9px}
.site{--p:0;background:#fff;color:var(--tx);border:1px solid #e6edf7;border-radius:11px;padding:7px 15px;font-size:12px;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 2px 6px rgba(0,60,140,.05);opacity:0;transform:translateY(10px) scale(.9);animation:chip .55s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--i)*.04s + .35s);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s,color .25s}
@keyframes chip{to{opacity:1;transform:none}}
.site::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p)*100%);background:linear-gradient(90deg,var(--b2),var(--b));transition:width .05s linear}
.site:hover{transform:translateY(-4px) scale(1.04);border-color:var(--b);color:var(--b);box-shadow:0 12px 22px -10px rgba(0,132,255,.55)}
.site:active{transform:scale(.93)}
.site.hold{transform:scale(.94);border-color:var(--b);color:var(--b)}
.site.has-note::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--b)}
.empty{font-size:11px;color:var(--sub);padding:4px 2px}
.hint{text-align:center;font-size:11px;color:var(--sub);margin:30px 0}
/* 弹窗 */
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,40,90,.22);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.show{opacity:1;pointer-events:auto}
.box{width:340px;max-width:100%;background:rgba(255,255,255,.8);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid #fff;border-radius:20px;padding:20px;box-shadow:0 30px 70px -20px rgba(0,80,180,.5);transform:translateY(34px) scale(.88);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.mask.show .box{transform:none}
.box h3{font-size:15px;color:var(--b);margin-bottom:3px}
.box .url{font-size:11px;color:var(--sub);word-break:break-all;margin-bottom:12px}
.box label{display:block;font-size:11px;color:var(--sub);margin:10px 0 4px}
.box input,.box textarea{width:100%;border:1px solid #dbe6f5;background:#fff;border-radius:11px;padding:8px 11px;font-size:12px;font-family:inherit;color:var(--tx);outline:none;transition:border-color .2s,box-shadow .2s}
.box input:focus,.box textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(0,132,255,.13)}
.box textarea{height:110px;resize:none;line-height:1.7}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
/* toast */
#toast{position:fixed;left:50%;bottom:34px;z-index:99;transform:translate(-50%,30px);background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--b);padding:8px 18px;border-radius:14px;font-size:12px;box-shadow:0 10px 30px -10px rgba(0,132,255,.4);opacity:0;transition:.4s cubic-bezier(.22,1,.36,1);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:11px;color:var(--sub);padding-top:20px;letter-spacing:2px}
footer span{color:var(--b);font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.owner-only{display:none}
body.owner .owner-only{display:inline-block}
body.owner.editing .edit-only{display:inline-block}
.tools .gear{padding:7px 11px;color:var(--sub);border-color:#eef2f8}
body:not(.owner) .tools{margin-top:18px}
body:not(.owner) .tools .gear{opacity:.35;border-color:transparent;box-shadow:none}
body:not(.owner) .tools .gear:hover{opacity:1}
#sync{display:none;text-align:center;font-size:11px;color:var(--sub);margin-top:12px;cursor:default}
body.owner #sync{display:block}
#sync.saving{color:var(--b)}#sync.fail{color:#ff4d4f;cursor:pointer}
.box .tip{font-size:11px;color:var(--sub);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="img/logostudy.png" alt="何岩学习网" onerror="this.outerHTML='<h1>何岩学习网</h1>'">
  </header>
  <div id="list"></div>
  <div class="tools">
    <button class="btn owner-only" onclick="addCat()">＋ 新建栏目</button>
    <button class="btn owner-only" id="editBtn" onclick="toggleEdit()">编辑模式</button>
    <button class="btn gear" onclick="openSettings()" title="GitHub 设置">⚙</button>
  </div>
  <div id="sync" onclick="syncClick()"></div>
  <footer>何岩设计制作</footer>
</div>
<div class="mask" id="mask"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
/* 数据保存在 GitHub 仓库的 JSON 文件里；在本页修改后会直接提交到仓库。 */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const CFG_K = 'heyanStudyCfg';
const DEF = { repo: 'heyan9/heyan9.github.io', branch: 'main', path: 'study-data.json', token: '' };
let data = { cats: [] }, firstRender = true;

function cfg() { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(CFG_K) || '{}')); } catch (e) { return Object.assign({}, DEF); } }
const isOwner = () => !!cfg().token;
function applyOwner() { document.body.classList.toggle('owner', isOwner()); if (!isOwner()) { document.body.classList.remove('editing'); $('editBtn').classList.remove('on'); $('editBtn').textContent = '编辑模式'; } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- GitHub 读写 ---------- */
const enc = str => { let b = ''; new TextEncoder().encode(str).forEach(x => b += String.fromCharCode(x)); return btoa(b); };
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), ch => ch.charCodeAt(0)));
const apiUrl = c => `https://api.github.com/repos/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
const hdr = c => ({ Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' });

async function load() {
  const c = cfg(); let d = null;
  if (c.token) {
    try {
      const r = await fetch(apiUrl(c) + '?ref=' + encodeURIComponent(c.branch) + '&t=' + Date.now(), { headers: hdr(c) });
      if (r.ok) d = JSON.parse(dec((await r.json()).content));
      else if (r.status === 404) d = { cats: [] };
    } catch (e) { console.error(e); }
  }
  if (!d) {
    try { const r = await fetch(c.path + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) d = await r.json(); } catch (e) { console.error(e); }
  }
  if (d && Array.isArray(d.cats)) data = d; else toast('读取数据失败，请检查仓库设置');
  render();
}

let saving = false, dirty = false;
function setSync(st) { const e = $('sync'); e.className = st; e.textContent = st === 'saving' ? '正在同步到 GitHub…' : st === 'fail' ? '同步失败，点击重试' : st === 'ok' ? '✓ 已同步到 GitHub' : ''; }
function syncClick() { if ($('sync').classList.contains('fail')) scheduleSave(); }
function scheduleSave() { dirty = true; if (!saving) runSave(); }
async function runSave() {
  saving = true;
  while (dirty) {
    dirty = false; setSync('saving');
    try { await push(); setSync('ok'); }
    catch (e) { console.error(e); setSync('fail'); toast('同步失败：' + e.message); break; }
  }
  saving = false;
}
async function push() {
  const c = cfg(), url = apiUrl(c), snap = JSON.stringify(data, null, 1);
  let sha;
  const g = await fetch(url + '?ref=' + encodeURIComponent(c.branch) + '&t=' + Date.now(), { headers: hdr(c) });
  if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error('读取 ' + g.status);
  const body = { message: 'update study sites', content: enc(snap), branch: c.branch };
  if (sha) body.sha = sha;
  const p = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, hdr(c)), body: JSON.stringify(body) });
  if (!p.ok) throw new Error(p.status === 401 || p.status === 403 ? '令牌无效或无写入权限' : p.status === 404 ? '仓库或分支不存在' : '写入 ' + p.status);
}
function commit(msg, newId) { render(newId); toast(msg); scheduleSave(); }

/* ---------- 渲染 ---------- */
function render(newId) {
  const list = $('list');
  if (!data.cats.length) { list.innerHTML = '<div class="hint">' + (isOwner() ? '还没有栏目，点击下方「＋ 新建栏目」开始吧' : '暂无内容') + '</div>'; return; }
  list.innerHTML = data.cats.map((c, i) => {
    const ss = c.sites || [];
    return `<section class="sec ${c.id === newId ? 'new' : ''}" data-cat="${c.id}" style="--i:${firstRender ? i : 0}">
      <div class="sh"><span class="dot"></span><b>${esc(c.name)}</b><i>${ss.length}</i><span class="sp"></span>
        <button class="btn sm owner-only" onclick="addSite('${c.id}')">＋ 网站</button>
        <button class="btn sm edit-only" onclick="renameCat('${c.id}')">改名</button>
        <button class="btn sm danger edit-only" onclick="delCat('${c.id}')">删除</button></div>
      <div class="sites">${ss.length ? ss.map((s, j) => `<button class="site ${s.note ? 'has-note' : ''}" data-c="${c.id}" data-s="${s.id}" style="--i:${j}">${esc(s.name)}</button>`).join('') : '<span class="empty">暂无网站</span>'}</div>
    </section>`;
  }).join('');
  firstRender = false;
}
const catOf = id => data.cats.find(x => x.id === id);
const siteOf = (cid, sid) => ((catOf(cid) || {}).sites || []).find(x => x.id === sid);

/* ---------- 弹窗 ---------- */
function openBox(html) { $('box').innerHTML = html; $('mask').classList.add('show'); setTimeout(() => { const f = $('box').querySelector('input,textarea'); f && f.focus(); }, 250); }
function closeBox() { $('mask').classList.remove('show'); }
$('mask').addEventListener('mousedown', e => { if (e.target === $('mask')) closeBox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBox(); });
function toggleEdit() { const on = document.body.classList.toggle('editing'); $('editBtn').classList.toggle('on', on); $('editBtn').textContent = on ? '完成编辑' : '编辑模式'; }

/* ---------- 设置 ---------- */
function openSettings() {
  const c = cfg();
  openBox(`<h3>GitHub 设置</h3>
    <label>仓库（用户名/仓库名）</label><input id="s1" value="${esc(c.repo)}">
    <label>分支</label><input id="s2" value="${esc(c.branch)}">
    <label>数据文件路径</label><input id="s3" value="${esc(c.path)}">
    <label>访问令牌 Token（只保存在本浏览器）</label><input id="s4" type="password" value="${esc(c.token)}" placeholder="github_pat_...">
    <div class="tip">令牌需要对该仓库有 Contents 读写权限。填好后即可在本页直接增删改，所有修改会自动提交到仓库。</div>
    <div class="row">${c.token ? '<button class="btn sm danger" onclick="clearToken()">退出编辑</button>' : ''}<button class="btn sm" onclick="closeBox()">取消</button><button class="btn sm on" onclick="saveSettings()">保存</button></div>`);
}
function saveSettings() {
  const n = { repo: $('s1').value.trim(), branch: $('s2').value.trim() || 'main', path: $('s3').value.trim() || 'study-data.json', token: $('s4').value.trim() };
  localStorage.setItem(CFG_K, JSON.stringify(n)); closeBox(); applyOwner(); setSync(''); toast(n.token ? '已保存，正在读取…' : '已保存'); load();
}
function clearToken() { const c = cfg(); c.token = ''; localStorage.setItem(CFG_K, JSON.stringify(c)); closeBox(); applyOwner(); setSync(''); toast('已退出编辑'); load(); }

/* ---------- 栏目 ---------- */
function addCat() {
  openBox(`<h3>新建栏目</h3><label>栏目名称</label><input id="f1" maxlength="20" placeholder="例如：编程学习" onkeydown="if(event.key==='Enter')saveCat()">
    <div class="row"><button class="btn" onclick="closeBox()">取消</button><button class="btn on" onclick="saveCat()">添加</button></div>`);
}
function saveCat() {
  const name = $('f1').value.trim(); if (!name) return; closeBox();
  const c = { id: uid(), name, sites: [] }; data.cats.push(c); commit('栏目已添加', c.id);
}
function renameCat(id) {
  openBox(`<h3>修改栏目名称</h3><input id="f1" maxlength="20" value="${esc(catOf(id).name)}" onkeydown="if(event.key==='Enter')doRename('${id}')">
    <div class="row"><button class="btn" onclick="closeBox()">取消</button><button class="btn on" onclick="doRename('${id}')">保存</button></div>`);
}
function doRename(id) { const name = $('f1').value.trim(); if (!name) return; closeBox(); catOf(id).name = name; commit('已保存'); }
function delCat(id) {
  openBox(`<h3>删除栏目</h3><div class="url">确定删除「${esc(catOf(id).name)}」及其下所有网站吗？</div>
    <div class="row"><button class="btn" onclick="closeBox()">取消</button><button class="btn danger" onclick="doDelCat('${id}')">删除</button></div>`);
}
function doDelCat(id) {
  closeBox(); const el = document.querySelector(`.sec[data-cat="${id}"]`); el && el.classList.add('out');
  setTimeout(() => { data.cats = data.cats.filter(x => x.id !== id); commit('栏目已删除'); }, 350);
}

/* ---------- 网站 ---------- */
function addSite(cid) {
  openBox(`<h3>添加网站</h3>
    <label>网站名称（按钮上显示）</label><input id="f1" maxlength="20" placeholder="例如：菜鸟教程">
    <label>网址</label><input id="f2" placeholder="https://...">
    <label>备注（长按网站可查看）</label><textarea id="f3" placeholder="可选"></textarea>
    <div class="row"><button class="btn" onclick="closeBox()">取消</button><button class="btn on" onclick="saveSite('${cid}')">添加</button></div>`);
}
function saveSite(cid) {
  const name = $('f1').value.trim(); let url = $('f2').value.trim(); const note = $('f3').value.trim();
  if (!name || !url) { toast('请填写名称和网址'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  closeBox(); const c = catOf(cid); (c.sites = c.sites || []).push({ id: uid(), name, url, note }); commit('网站已添加');
}
function openSite(cid, sid) { const s = siteOf(cid, sid); if (s) window.open(s.url, '_blank'); }
function showNote(cid, sid) {
  const s = siteOf(cid, sid); if (!s) return; const own = isOwner();
  openBox(`<h3>${esc(s.name)}</h3><div class="url">${esc(s.url)}</div>
    <label>备注</label><textarea id="f3" ${own ? '' : 'readonly'} placeholder="${own ? '还没有备注，写点什么吧' : '暂无备注'}">${esc(s.note)}</textarea>
    <div class="row">${own ? `<button class="btn sm danger" onclick="delSite('${cid}','${sid}')">删除网站</button>` : ''}<button class="btn sm" onclick="openSite('${cid}','${sid}')">打开</button>${own ? `<button class="btn sm on" onclick="saveNote('${cid}','${sid}')">保存备注</button>` : ''}</div>`);
}
function saveNote(cid, sid) { const note = $('f3').value.trim(); closeBox(); siteOf(cid, sid).note = note; commit('备注已保存'); }
function delSite(cid, sid) { closeBox(); const c = catOf(cid); c.sites = c.sites.filter(x => x.id !== sid); commit('网站已删除'); }

/* ---------- 长按 / 点击 ---------- */
const HOLD = 550; let hTimer, hRaf, hStart, hBtn, hDone = false;
function holdEnd() { clearTimeout(hTimer); cancelAnimationFrame(hRaf); if (hBtn) { hBtn.classList.remove('hold'); hBtn.style.setProperty('--p', 0); } hBtn = null; }
$('list').addEventListener('pointerdown', e => {
  const b = e.target.closest('.site'); if (!b) return;
  hDone = false; hBtn = b; hStart = performance.now(); b.classList.add('hold');
  const step = () => { if (!hBtn) return; hBtn.style.setProperty('--p', Math.min(1, (performance.now() - hStart) / HOLD)); hRaf = requestAnimationFrame(step); };
  step();
  hTimer = setTimeout(() => { hDone = true; const c = b.dataset.c, s = b.dataset.s; holdEnd(); if (navigator.vibrate) navigator.vibrate(18); showNote(c, s); }, HOLD);
});
['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(ev => $('list').addEventListener(ev, e => { if (ev === 'pointermove' && Math.abs(e.movementX) + Math.abs(e.movementY) < 3) return; holdEnd(); }));
$('list').addEventListener('contextmenu', e => { if (e.target.closest('.site')) e.preventDefault(); });
$('list').addEventListener('click', e => {
  const b = e.target.closest('.site'); if (!b) return;
  if (hDone) { hDone = false; return; }
  openSite(b.dataset.c, b.dataset.s);
});

/* ---------- 按钮涟漪 ---------- */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn'); if (!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement('span');
  s.className = 'rip'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 650);
});

applyOwner();
load();
