<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1观赛网</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--red:#FF1E00;--bg:#0a0a0a;--bg2:#111;--card:#151515;--line:#2e2e2e;--txt:#fff;--mut:#9a9a9a;--hd:#000;--gh:#262626}
[data-theme=light]{--bg:#f2f2f2;--bg2:#fafafa;--card:#fff;--line:#dcdcdc;--txt:#111;--mut:#666;--hd:#fff;--gh:#111}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5;overflow-x:hidden}
a{color:inherit}
header{position:sticky;top:0;z-index:20;transition:transform .3s ease;background:var(--hd);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:8px;padding:6px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;font-style:italic;white-space:nowrap}
.logo img{height:22px}
.hr{display:flex;align-items:center;gap:4px;margin-left:auto}
button,.btn{background:var(--red);color:#fff;border:0;padding:5px 10px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;text-decoration:none;display:inline-block;font-family:inherit}
button.ghost,button.ic{background:var(--gh);color:#fff}
.btn.s{background:var(--txt);color:var(--bg)}
#who{font-size:12px;color:var(--mut);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-hide{transform:translateY(-100%)}
.chk{height:8px;background:repeating-linear-gradient(90deg,var(--txt) 0 12px,var(--bg) 12px 24px)}
main{max-width:1100px;margin:auto;padding:20px 16px 40px}
h2{font-size:19px;letter-spacing:2px;border-left:8px solid var(--red);padding-left:12px;margin:34px 0 12px;font-style:italic}
.card{background:var(--card);border:1px solid var(--line);padding:16px}
.hero{border-left:8px solid var(--red)}
.hero small{color:var(--red);font-weight:800;letter-spacing:2px}
.hero h1{font-size:clamp(24px,6vw,42px);font-style:italic;font-weight:900;line-height:1.15}
.hero .sub{color:var(--mut);margin-top:6px}
.cd{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cd div{background:var(--hd);color:var(--txt);border:1px solid var(--line);border-top:4px solid var(--red);padding:8px 14px;text-align:center;min-width:64px}
.cd b{font-size:26px;display:block}.cd small{color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.tbar{display:flex;gap:6px;margin-bottom:10px}
select{flex:1;min-width:0;background:var(--card);color:var(--txt);border:1px solid var(--line);padding:8px;font-size:14px}
.tbar button{padding:8px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
svg.track{width:100%;max-height:240px;display:block}
.time{font-size:30px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{border:1px solid var(--line);padding:2px 8px;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:var(--gh);padding:8px 14px;font-size:13px}
.tabs button.on{background:var(--red)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;border-bottom:2px solid var(--red);padding:6px 8px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:nth-child(2) td:first-child,tr:nth-child(2) td b{color:var(--red)}
td.p{font-weight:900;width:36px}td.pt{font-weight:800}
td small{color:var(--mut)}
.sess{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;margin-bottom:6px;flex-wrap:wrap;border-left:6px solid var(--line);background:var(--bg2)}
.sess.r{border-color:var(--red)}.sess.next{border-color:var(--red);background:var(--hd)}
.sess.past{opacity:.5}.sess .rl{color:var(--red);font-weight:700;margin-left:8px}.sess .n{font-weight:700}.sess .t{color:var(--mut);font-variant-numeric:tabular-nums}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.gal figure{flex:none;width:min(400px,82%);scroll-snap-align:start;position:relative;aspect-ratio:16/9;background:var(--bg2);overflow:hidden;border-bottom:4px solid var(--red)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption small{display:block;font-weight:400;opacity:.8;margin-top:2px}.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,#000d);color:#fff;font-size:13px;font-weight:600}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.live a{text-decoration:none;padding:18px;display:block;color:#fff;background:var(--red);border:2px solid var(--red);transition:.2s}
.live a:hover{background:#000}
.live b{font-size:18px;display:block}.live span{opacity:.85;font-size:13px}
details.n{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);margin-bottom:8px}
details.n summary{padding:12px 14px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
details.n summary::-webkit-details-marker{display:none}
details.n summary::after{content:"＋";color:var(--red);font-weight:900;flex:none}
details.n[open] summary::after{content:"－"}
details.n .bd{padding:0 14px 14px;font-size:14px;color:var(--txt);border-top:1px solid var(--line);padding-top:10px}
details.n .bd .pp{display:block;margin-bottom:10px;line-height:1.7}details.n .bd .pp.o{color:var(--mut)}.sbar{display:flex;gap:6px;margin-bottom:8px}
details.n .bd small{display:block;color:var(--mut);margin-top:8px}
details.n .bd a{color:var(--red);font-weight:700;text-decoration:none;display:inline-block;margin-top:8px}
textarea,input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:10px;font-size:15px;font-family:inherit}
.msg{padding:12px 0;border-bottom:1px solid var(--line)}.msg small{color:var(--mut)}.msg b{color:var(--red)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}.modal .card{width:100%;max-width:380px;border-top:5px solid var(--red)}
.modal input{margin:8px 0}.err{color:var(--red);font-size:13px;min-height:18px}
footer{text-align:center;padding:24px;color:var(--mut);background:var(--hd);border-top:3px solid var(--red)}
@media(max-width:800px){.grid{grid-template-columns:1fr}.live{grid-template-columns:1fr}}
@media(max-width:640px){
 header{padding:5px 8px;gap:4px}.logo{font-size:14px;gap:5px}.logo img{height:18px}
 #who{display:none}button,.btn{padding:5px 7px;font-size:11px}
 main{padding:12px 10px 30px}h2{font-size:16px;margin:24px 0 10px;padding-left:9px;border-left-width:6px}
 .card{padding:12px}.hero h1{font-size:23px}
 .cd{gap:6px}.cd div{min-width:0;flex:1;padding:6px 4px}.cd b{font-size:21px}
 select{font-size:16px}.tbar button{padding:9px 12px}.time{font-size:27px}
 .tabs button{flex:1;padding:8px 4px;font-size:12px}table{font-size:13px}
 .sess{padding:8px 10px;font-size:14px}.gal figure{width:86%}textarea,input{font-size:16px}
}
@media(max-width:360px){.logo{font-size:13px}.logo img{height:16px}button,.btn{padding:5px 5px;font-size:10px}}
</style>
</head>

/* 赛道绘制 */
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const mem={};
function slim(sh){const n=sh.pts.length,st=Math.max(1,Math.floor(n/180));return{src:sh.src,cor:sh.cor,pts:sh.pts.filter((_,i)=>i%st===0).map(p=>[+p[0].toFixed(2),+p[1].toFixed(2)])}}
function fit(pts){
  let x0=1e18,x1=-1e18,y0=1e18,y1=-1e18;
  pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
  const W=800,H=520,P=70,s=Math.min((W-2*P)/(x1-x0||1),(H-2*P)/(y1-y0||1));
  const ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;
  return p=>[ox+(p[0]-x0)*s,oy+(p[1]-y0)*s];
}
async function getMV(t){
  if(!t.mv)throw 0;
  const d=await J(`https://api.multiviewer.app/api/v1/circuits/${t.mv}/${new Date().getFullYear()}`,7000);
  const a=(d.rotation||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),rot=(x,y)=>[x*c-y*s,-(x*s+y*c)];
  return slim({src:'MultiViewer',pts:d.x.map((x,i)=>rot(x,d.y[i])),cor:(d.corners||[]).map(k=>({n:k.number,p:rot(k.trackPosition.x,k.trackPosition.y)}))});
}
async function getGeo(t){
  if(!mem.geo)mem.geo=J('https://cdn.jsdelivr.net/gh/bacinger/f1-circuits@master/f1-circuits.geojson',12000);
  const g=await mem.geo;
  const f=g.features.find(f=>norm((f.properties.Name||'')+' '+(f.properties.Location||'')).includes(t.g));
  if(!f)throw 0;
  const co=f.geometry.coordinates,k=Math.cos(co[0][1]*Math.PI/180);
  return slim({src:'f1-circuits',pts:co.map(c=>[c[0]*k,-c[1]]),cor:[]});
}
let tok=0;
function render(t,sh){
  const f=fit(sh.pts),P=sh.pts.map(f);
  const d='M'+P.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
  const cx=P.reduce((a,p)=>a+p[0],0)/P.length,cy=P.reduce((a,p)=>a+p[1],0)/P.length;
  let h=`<path d="${d}" fill="none" style="stroke:var(--txt)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
  <circle cx="${P[0][0]}" cy="${P[0][1]}" r="8" fill="#FF1E00"/>`;
  const names=CN[t.id]||{},list=[];
  sh.cor.forEach(k=>{
    const q=f(k.p),dx=q[0]-cx,dy=q[1]-cy,L=Math.hypot(dx,dy)||1,lx=q[0]+dx/L*20,ly=q[1]+dy/L*20,nm=names[k.n];
    h+=`<circle cx="${lx}" cy="${ly}" r="9" fill="#FF1E00"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${k.n}</text>`;
    if(nm)h+=`<text x="${lx+(dx>=0?13:-13)}" y="${ly+4}" text-anchor="${dx>=0?'start':'end'}" font-size="13" font-weight="700" style="fill:var(--mut)">${esc(nm)}</text>`;
    list.push(`T${k.n}${nm?' '+nm:''}`);
  });
  $('svg').innerHTML=h;
  $('trNote').textContent='示意图 · 红点为起终点'+(sh.cor.length?'':'（此数据源无弯角编号）');
  $('clist').innerHTML=list.length?list.map(esc).join(' · '):'暂无';
}
async function drawTrack(t){
  const my=++tok;let rank=0;
  const show=(sh,r)=>{if(my!==tok||r<=rank)return;rank=r;render(t,sh)};
  const rk=sh=>sh.src==='MultiViewer'?3:1;
  const c=LS.gj('sh_'+t.id);
  if(c){show(c,rk(c));if(rk(c)===3)return}
  else $('svg').innerHTML='<text x="400" y="260" style="fill:var(--mut)" text-anchor="middle" font-size="18">加载中…</text>';
  const save=sh=>{LS.sj('sh_'+t.id,sh);return sh};
  const a=getMV(t).then(sh=>{save(sh);show(sh,3)});
  const b=getGeo(t).then(sh=>{if(rank<1)save(sh);show(sh,1)});
  await Promise.allSettled([a,b]);
  if(my===tok&&!rank){$('svg').innerHTML='<text x="400" y="260" style="fill:var(--mut)" text-anchor="middle" font-size="18">暂无该赛道轨迹数据</text>';$('trNote').textContent='';$('clist').textContent='暂无'}
}
async function drawRecord(t){
  $('info').innerHTML=`<span>${t.len} km</span><span>${t.t} 弯</span><span>${esc(t.zh)}</span>`;
  const k='rec_'+t.id;let b=LS.gj(k);
  const paint=b=>{
    if(!b){$('pn').textContent='暂无数据';$('py').textContent='';$('pt').textContent='--:--.---';return}
    $('pn').innerHTML=dn(b.drv);$('py').textContent=b.year+' 赛季（2006年以来的杆位最快圈）';$('pt').textContent=b.s};
  if(b)paint(b);else{$('pn').textContent='加载中…';$('py').textContent='';$('pt').textContent='--:--.---'}
  if(b)return;
  try{
    const d=await J(`https://api.jolpi.ca/ergast/f1/circuits/${t.id}/qualifying/1.json?limit=100`);
    b=null;
    d.MRData.RaceTable.Races.forEach(r=>{const q=r.QualifyingResults[0];if(!q)return;
      [q.Q1,q.Q2,q.Q3].forEach(s=>{const m=s&&s.match(/^(\d+):(\d+\.\d+)$/);if(!m)return;
        const ms=(+m[1]*60+ +m[2])*1000;if(!b||ms<b.ms)b={ms,s,year:r.season,drv:{givenName:q.Driver.givenName,familyName:q.Driver.familyName}}})});
    if(b)LS.sj(k,b);
    if(TR[cur]===t)paint(b);
  }catch(e){if(TR[cur]===t)$('pn').textContent='圈速数据加载失败'}
}

/* 赛程 */
const NAMES={FirstPractice:'练习赛 FP1',SecondPractice:'练习赛 FP2',ThirdPractice:'练习赛 FP3',SprintQualifying:'冲刺排位赛',Sprint:'冲刺赛',Qualifying:'排位赛'};
const FD={year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false};
const fmt=d=>d.toLocaleString('zh-CN',FD);
const fday=s=>new Date(s+'T12:00:00').toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
const dt=o=>o&&new Date(o.date+'T'+(o.time||'12:00:00Z'));
let target=null,SESS=[];
async function loadSched(){
  let r;
  try{r=(await J('https://api.jolpi.ca/ergast/f1/current/next.json')).MRData.RaceTable.Races[0]}catch(e){}
  if(!r)r={raceName:"United States Grand Prix",date:"2026-10-18",time:"20:00:00Z",Circuit:{circuitId:'americas',circuitName:"Circuit of the Americas",Location:{locality:"Austin",country:"USA"}},
    FirstPractice:{date:"2026-10-16",time:"17:30:00Z"},SecondPractice:{date:"2026-10-16",time:"21:00:00Z"},Qualifying:{date:"2026-10-17",time:"21:00:00Z"}};
  const ti=TR.findIndex(t=>t.id===r.Circuit.circuitId);
  $('raceName').textContent=(ti>=0?TR[ti].zh.split(' · ')[0]+' · ':'')+r.raceName;
  $('raceSub').textContent=r.Circuit.circuitName+' · '+r.Circuit.Location.locality+', '+r.Circuit.Location.country;
  SESS=[];
  Object.keys(NAMES).forEach(k=>{if(r[k])SESS.push([NAMES[k],dt(r[k]),''])});
  SESS.push(['正赛',dt(r),'r']);
  $('raceSub').textContent+=' · '+fmt(dt(r));
  drawSess();
  if(ti>=0&&!manual&&ti!==cur)selTrack(ti,true);
  tick();
}
function rel(d){const s=(d-new Date())/1000;if(s<-7200)return'已结束';if(s<=0)return'进行中';const D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60);return D?`${D}天${H}小时后`:H?`${H}小时${M}分后`:`${M}分钟后`}
function drawSess(){
  const now=new Date(),nx=SESS.find(x=>x[1]-now>-7200000);target=nx?nx[1]:null;
  const o=-new Date().getTimezoneOffset()/60;
  $('sched').innerHTML=SESS.map(x=>`<div class="sess ${x[2]} ${x===nx?'next':''} ${x[1]-now<-7200000?'past':''}"><span class="n">${x[0]}${x===nx?' ← 下一场':''}</span><span class="t">${fmt(x[1])}<span class="rl">${rel(x[1])}</span></span></div>`).join('')+`<div class="mut">时间已按你的本地时区显示：${Intl.DateTimeFormat().resolvedOptions().timeZone}（UTC${o>=0?'+':''}${o}）</div>`;
}
function tick(){
  if(SESS.length&&new Date().getSeconds()===0)drawSess();
  if(!target){$('cd').innerHTML='<div><b>—</b><small>暂无</small></div>';return}
  const s=Math.max(0,Math.floor((target-new Date())/1000));
  $('cd').innerHTML=[[Math.floor(s/86400),'天'],[Math.floor(s%86400/3600),'时'],[Math.floor(s%3600/60),'分'],[s%60,'秒']].map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><small>${x[1]}</small></div>`).join('');
}
setInterval(tick,1000);loadSched();setInterval(loadSched,600000);

async function loadStand(){

  ['d','c','w','t'].forEach(k=>ST[k]=LS.gj(K(k))||(k==='t'?'':null));stRender();

  await Promise.allSettled([
    J(base+'/driverstandings.json').then(j=>{const l=j.MRData.StandingsTable.StandingsLists[0],s=j.MRData.StandingsTable.season||(my==='current'?YR:my);
      put('d',l?l.DriverStandings:[]);put('t',s+' 赛季积分榜'+(l?' · 第'+l.round+'站后':''))}),
    J(base+'/constructorstandings.json').then(j=>{const l=j.MRData.StandingsTable.StandingsLists[0];put('c',l?l.ConstructorStandings:[])}),
    J(base+'/results/1.json?limit=100',12000).then(j=>put('w',j.MRData.RaceTable.Races))
  ]);

/* 翻译 */
const tcache=LS.gj('tr')||{};
async function tr(text){
  if(!text)return'';
  if(tcache[text])return tcache[text];
  let out='';
  try{const j=await J('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q='+encodeURIComponent(text));out=j[0].map(x=>x[0]).join('')}
  catch(e){try{const j=await J('https://api.mymemory.translated.net/get?langpair=en|zh-CN&q='+encodeURIComponent(text.slice(0,450)));out=j.responseData.translatedText}catch(e2){}}
  if(out&&text.length<200){tcache[text]=out;const ks=Object.keys(tcache);if(ks.length>120)delete tcache[ks[0]];LS.sj('tr',tcache)}
  return out||text;
}
async function trLong(s){
  const parts=s.match(/[^.!?]+[.!?]*\s*/g)||[s],ch=[];let c='';
  parts.forEach(p=>{if((c+p).length>800){if(c)ch.push(c);c=p}else c+=p});if(c)ch.push(c);
  return(await Promise.all(ch.map(tr))).join('');
}

const fullCache={};
async function fullText(u){
  if(fullCache[u]!==undefined)return fullCache[u];
  let out='';
  try{
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);
    const r=await fetch('https://r.jina.ai/'+u,{signal:c.signal});clearTimeout(tm);
    if(!r.ok)throw 0;let s=await r.text();
    const i=s.indexOf('Markdown Content:');if(i>=0)s=s.slice(i+17);
    s=s.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/^#+\s*/gm,'').replace(/[*_`>]+/g,'');
    out=s.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>60).slice(0,40).join('\n').slice(0,9000);
  }catch(e){}
  return fullCache[u]=out;
}
const FEEDS=['https://www.motorsport.com/rss/f1/news/','https://www.autosport.com/rss/f1/news/'];
const strip=h=>(h||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#?[a-z0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
function imgOf(i){
  if(i.thumbnail)return i.thumbnail;
  if(i.enclosure&&i.enclosure.link&&/\.(jpe?g|png|webp)|image/i.test(i.enclosure.link+(i.enclosure.type||'')))return i.enclosure.link;
  const m=((i.content||'')+(i.description||'')).match(/<img[^>]+src=["']([^"']+)/i);return m?m[1]:'';
}
async function loadNews(){
  let items=[];
  await Promise.all(FEEDS.map(async f=>{try{
    const j=await J('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f),10000);
    (j.items||[]).forEach(i=>items.push({t:i.title,l:i.link,body:strip(i.content||i.description).slice(0,1800),img:imgOf(i),pd:i.pubDate,ts:new Date((i.pubDate||'').replace(' ','T')+'Z').getTime()||0}));
  }catch(e){}}));
  const seen={};items=items.filter(i=>!seen[i.t]&&(seen[i.t]=1)).sort((a,b)=>b.ts-a.ts).slice(0,12);
  if(!items.length){$('news').innerHTML='<div class="card"><a href="https://www.formula1.com/en/latest" target="_blank" rel="noopener">资讯加载失败，点击前往F1官网 →</a></div>';$('gal').innerHTML='';return}
  const open={};document.querySelectorAll('#news details[open]').forEach(d=>open[d.dataset.l]=1);
  $('news').innerHTML=items.map((i,k)=>`<details class="n" data-k="${k}" data-l="${esc(i.l)}"${open[i.l]?' open':''}><summary><span id="nt${k}">${esc(i.t)}</span></summary><div class="bd"><div id="nb${k}">展开后自动加载全文并翻译…</div><small>发布时间：${i.ts?fmt(new Date(i.ts)):'未知'} · 原标题：${esc(i.t)}</small><a href="${esc(i.l)}" target="_blank" rel="noopener" style="font-weight:400;font-size:12px;color:var(--mut)">原文页面</a></div></details>`).join('');
  const withImg=items.filter(i=>i.img);
  $('gal').innerHTML=withImg.map((i,k)=>`<figure><img src="${esc(i.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentNode.remove()"><figcaption><span id="gc${k}">${esc(i.t)}</span><small>${i.ts?fmt(new Date(i.ts)):''}</small></figcaption></figure>`).join('')||'<div class="mut">暂无图片</div>';
  document.querySelectorAll('#news details').forEach(d=>{
    const k=+d.dataset.k,it=items[k];let done=0;
    const go=async()=>{
      if(done)return;done=1;const el=$('nb'+k);el.innerHTML='<span class="pp o">正在加载全文…</span>';
      let txt=await fullText(it.l);if(!txt||txt.length<(it.body||'').length)txt=it.body||it.t;
      const ps=txt.split('\n').map(x=>x.trim()).filter(Boolean);
      el.innerHTML=ps.map((p,i)=>`<span class="pp o" id="p${k}_${i}">${esc(p)}</span>`).join('');
      for(let i=0;i<ps.length;i+=4)await Promise.all(ps.slice(i,i+4).map(async(p,j)=>{const z=await trLong(p),e=$(`p${k}_${i+j}`);if(e){e.textContent=z;e.classList.remove('o')}}));
    };
    d.addEventListener('toggle',()=>{if(d.open)go()});if(d.open)go();
  });
  items.forEach(async(i,k)=>{const t=await tr(i.t);if($('nt'+k))$('nt'+k).textContent=t;const g=withImg.indexOf(i);if(g>=0&&$('gc'+g))$('gc'+g).textContent=t});
}
loadNews();setInterval(loadNews,900000);

/* 顶栏：下滑自动收起，上滑 / 鼠标移到最上方时显示 */
(()=>{
  const h=document.querySelector('header');let last=window.scrollY;
  const show=()=>h.classList.remove('hdr-hide'),hide=()=>{if(!h.matches(':hover')&&!document.querySelector('.modal.on')&&!h.contains(document.activeElement))h.classList.add('hdr-hide')};
  addEventListener('scroll',()=>{
    const y=window.scrollY;
    if(y<=60||y<last-4)show();
    else if(y>last+4)hide();
    last=y;
  },{passive:true});
  addEventListener('mousemove',e=>{if(e.clientY<=40)show()},{passive:true});
  h.addEventListener('mouseenter',show);
})();
