<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迷梦人 Onirim</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050a;--line:rgba(255,255,255,.14);--blue:#3355ff;--glow:#7d95ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 "Noto Sans SC",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 0,rgba(51,85,255,.4),transparent 70%),radial-gradient(50% 35% at 50% 100%,rgba(51,85,255,.2),transparent 70%);animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.55}}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:20}
body.flash #fx{background:radial-gradient(circle,#fff,rgba(125,149,255,.6) 40%,transparent 75%);animation:fl .9s ease-out}
body.dark #fx{background:radial-gradient(circle,transparent 30%,#000 100%);animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
body.shake main{animation:sh .5s}
@keyframes sh{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
main{position:relative;max-width:1040px;margin:0 auto;padding:18px 18px 28px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font:900 clamp(34px,6vw,54px)/1 "Noto Serif SC",serif;letter-spacing:.14em;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
h1 span{display:inline-block;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n)*.18s)}
h1 small{font:700 11px "Noto Sans SC";letter-spacing:.55em;opacity:.55;margin-left:14px;animation:rise 1.4s .7s backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(10px)}}
.stats{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border-radius:999px;padding:5px 16px;display:flex;gap:8px;align-items:baseline;font-size:13px;color:#b9c0dc}
.pill b{font:900 20px "Noto Serif SC",serif;color:#fff}
.doors{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.dc{display:flex;gap:7px}
.arch{width:32px;height:44px;border-radius:16px 16px 5px 5px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--k);transition:.4s}
.arch svg{width:20px;height:20px}
.arch.on{border-color:var(--k);background:radial-gradient(circle at 50% 80%,color-mix(in srgb,var(--k) 45%,transparent),transparent 75%);box-shadow:0 0 18px color-mix(in srgb,var(--k) 70%,transparent)}
.arch.new{animation:unlock 1.4s}
@keyframes unlock{0%{transform:scale(.6);box-shadow:0 0 0 0 #fff}40%{transform:scale(1.35);box-shadow:0 0 50px 12px var(--k)}100%{transform:scale(1)}}
.stage{display:flex;gap:14px;align-items:stretch}
.table{flex:1;min-height:210px;border-radius:26px;border:1.5px dashed rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:16px 10px;transition:.25s;min-width:0}
.table.hot{border:1.5px solid var(--glow);background:rgba(51,85,255,.14);box-shadow:inset 0 0 50px rgba(51,85,255,.5),0 0 34px rgba(51,85,255,.4)}
.table.no{border:1.5px solid #ff4d5e;box-shadow:inset 0 0 50px rgba(255,77,94,.4)}
.row{display:flex;justify-content:center;max-width:100%;padding:4px 14px;min-height:130px;align-items:center}
.row .card{--s:12px;margin-left:-16px}.row .card:first-child{margin-left:0}
.hint{color:#8f98ba;text-align:center}
.pips{display:flex;gap:7px;align-items:center;font-size:12px;color:#8f98ba}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid #8f98ba}
.pips i.on{background:var(--k);border-color:var(--k);box-shadow:0 0 10px var(--k)}
.pile{width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;color:#8f98ba;text-align:center;border-radius:22px;transition:.25s}
.pile b{display:block;font:900 20px "Noto Serif SC",serif;color:#fff}
.stack{position:relative;width:5.6em;height:8em;font-size:var(--s)}
.stack .card{--s:inherit;position:absolute;left:0;top:0;width:100%;height:100%;font-size:inherit;transform:translate(calc(var(--i)*-2px),calc(var(--i)*-2px))}
#disc{border:1.5px dashed rgba(255,255,255,.22);padding:14px 4px}
#disc.hot{border:1.5px solid #fff;background:rgba(255,255,255,.1);box-shadow:0 0 30px rgba(255,255,255,.3)}
.hand{display:flex;justify-content:center;padding:44px 6px 6px;min-height:250px}
.slot{margin:0 -9px;transform:translateY(var(--y)) rotate(var(--r));transform-origin:50% 130%;transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:none;cursor:grab;outline:0}
.slot:hover,.slot:focus-visible{transform:translateY(calc(var(--y) - 28px)) scale(1.07);z-index:5}
.slot.sel{transform:translateY(-40px) scale(1.1);z-index:6}
.slot.sel .card{box-shadow:0 0 0 2px var(--glow),0 0 36px rgba(125,149,255,.8),0 1em 2em rgba(0,0,0,.7)}
.slot.drag{transition:none;z-index:50;cursor:grabbing}
.slot.deal{animation:deal .7s var(--d) cubic-bezier(.2,.9,.25,1) backwards}
@keyframes deal{from{opacity:0;transform:translate(-45vw,-40vh) rotate(-50deg) scale(.4)}}
.slot.bad .card{filter:grayscale(.8) brightness(.8)}
.card{--k:#111;font-size:var(--s,17px);width:7em;height:10em;border-radius:1em;background:linear-gradient(155deg,#fff,#e9edf8);color:var(--k);position:relative;display:grid;place-items:center;flex:none;user-select:none;box-shadow:0 .1em .2em rgba(0,0,0,.4),0 .8em 1.6em -.3em rgba(0,0,0,.75),inset 0 0 0 .08em #fff}
.card:before{content:"";position:absolute;inset:.45em;border-radius:.65em;border:.06em solid color-mix(in srgb,var(--k) 35%,transparent)}
.card .art{width:5em;height:5em;filter:drop-shadow(0 .2em .5em color-mix(in srgb,var(--k) 45%,transparent))}
.ix{position:absolute;top:.8em;left:.85em;display:flex;flex-direction:column;align-items:center;gap:.2em;font:900 .95em/1 "Noto Serif SC",serif}
.ix svg{width:1em;height:1em}
.ix.r{top:auto;left:auto;bottom:.8em;right:.85em;transform:rotate(180deg)}
.cn{position:absolute;bottom:.85em;left:0;right:0;text-align:center;font-size:.68em;font-weight:700;letter-spacing:.35em;text-indent:.35em;color:#1a2040;opacity:.7}
.card.nm,.card.back{background:radial-gradient(circle at 50% 40%,#18226a,#05060d 72%);color:#fff;box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(51,85,255,.55),inset 0 0 0 .08em rgba(255,255,255,.35)}
.nm:before,.back:before{border-color:rgba(255,255,255,.3)}
.nm .cn{color:#fff}
.back .art{width:2.6em;height:2.6em;opacity:.8}
.pop{animation:pop .6s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{0%{opacity:0;transform:translateY(-70px) scale(1.4) rotate(-8deg);filter:brightness(2)}100%{opacity:1}}
.msg{text-align:center;color:#c6cdea;min-height:24px;transition:.3s}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:700 14px "Noto Sans SC",sans-serif;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;padding:10px 24px;cursor:pointer;transition:.2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14);transform:translateY(-2px)}
.btn.p{background:#fff;color:#04050a;border-color:#fff}
.btn.p:hover:not(:disabled){box-shadow:0 0 28px rgba(125,149,255,.8);background:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
#M{position:fixed;inset:0;background:rgba(2,3,8,.75);backdrop-filter:blur(10px);display:none;place-items:center;padding:16px;z-index:30;overflow:auto}
#M.on{display:grid}
.box{background:linear-gradient(180deg,#10142a,#080a14);border:1px solid var(--line);border-radius:26px;padding:28px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 80px rgba(51,85,255,.35);animation:mi .35s cubic-bezier(.2,.9,.25,1)}
@keyframes mi{from{opacity:0;transform:scale(.9) translateY(20px)}}
.box h2{margin:0;font:900 28px "Noto Serif SC",serif}
.box p{margin:0;color:#b9c0dc}
.box ul{margin:0;padding-left:20px;color:#b9c0dc}.box li{margin:4px 0}
.pr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px}
.pr .card{--s:12px;cursor:pointer;transition:.2s}.pr .card:hover{transform:translateY(-8px);box-shadow:0 0 30px var(--glow)}

.ib{cursor:pointer;color:#fff;font:inherit;align-items:center}.ib:hover{background:rgba(255,255,255,.14)}.pill img{width:20px;height:20px;border-radius:50%;align-self:center}
.card.nm{background:radial-gradient(circle at 50% 45%,#40061a,#04050a 72%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.8em rgba(255,30,70,.65),inset 0 0 0 .08em rgba(255,70,100,.7)}
.nm:before{border-color:rgba(255,80,110,.5)}.nm .cn{color:#ff7a92}
.nm .art{animation:eye 2.6s ease-in-out infinite}
@keyframes eye{50%{transform:scale(1.08);filter:drop-shadow(0 0 .5em #ff2a4d)}}
#haunt{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;background:radial-gradient(circle,transparent 25%,rgba(120,0,28,.8) 100%);transition:opacity .6s}
body.haunt #haunt{opacity:1;animation:hp 1.2s infinite alternate}
@keyframes hp{to{opacity:.55}}
body.haunt:before{filter:hue-rotate(150deg) saturate(1.7)}
body.haunt .box{border-color:#c0102a;box-shadow:0 0 90px rgba(210,0,45,.55);background:linear-gradient(180deg,#26091a,#07040a)}
body.haunt .box h2{color:#ff4a68;text-shadow:2px 0 #3d63ff,-2px 0 #ff2a4d;animation:gl .25s steps(2) 8}
@keyframes gl{50%{transform:translate(3px,-2px) skewX(6deg)}}
#nmv{position:fixed;inset:0;z-index:25;display:none;background:rgba(0,0,0,.9);flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:16px}
#nmv.on{display:flex;animation:ni .3s}
@keyframes ni{from{opacity:0}}
#nmv .card{--s:24px;animation:nd 1.3s cubic-bezier(.2,.9,.2,1)}
@keyframes nd{0%{transform:translateY(-120vh) rotate(30deg) scale(.6)}50%{transform:translateY(0) rotate(-4deg) scale(1.12)}65%{transform:translate(-9px,4px)}80%{transform:translate(8px,-3px)}100%{transform:none}}
#nmv h2{margin:0;font:900 clamp(34px,8vw,64px) "Noto Serif SC",serif;color:#ff3355;letter-spacing:.3em;text-indent:.3em;text-shadow:3px 0 #3d63ff,-3px 0 #ff2a4d;animation:gl .22s steps(2) infinite}
#nmv p{margin:0;color:#c88a98;letter-spacing:.2em}
body.flash #fx{background:#fff;animation:fl2 1.2s ease-out}
@keyframes fl2{0%{opacity:0}3%{opacity:1}20%{opacity:1}100%{opacity:0}}
body.flash main{animation:zm .9s ease-out}
@keyframes zm{0%{transform:scale(1.04)}100%{transform:none}}
#door{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:22;opacity:0}
#door.on{animation:dr 2s ease-out}
@keyframes dr{0%,10%{opacity:1}100%{opacity:0}}
#door i{position:absolute;width:20vmin;height:20vmin;border-radius:50%;border:6px solid var(--k);box-shadow:0 0 60px var(--k),inset 0 0 60px var(--k)}
#door.on i{animation:rg 1.5s ease-out}
@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(8);opacity:0}}
#door b{font:900 clamp(38px,10vw,92px) "Noto Serif SC",serif;letter-spacing:.25em;text-indent:.25em;color:#fff;text-shadow:0 0 50px var(--k),0 0 14px var(--k)}
#door.on b{animation:tx 2s cubic-bezier(.2,.9,.2,1)}
@keyframes tx{from{transform:scale(1.8);letter-spacing:.6em;filter:blur(12px)}}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);z-index:60;background:#0d1226;border:1px solid var(--glow);border-radius:16px;padding:10px 22px;box-shadow:0 0 40px rgba(125,149,255,.5);transition:transform .5s cubic-bezier(.2,.9,.2,1);font-weight:700}
#toast.on{transform:translate(-50%,0)}
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(60% 50% at 50% 30%,rgba(51,85,255,.45),transparent 70%),#04050a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px;transition:opacity 1s}
#intro.off{opacity:0;pointer-events:none}
#intro .it{font:900 clamp(64px,16vw,140px)/1 "Noto Serif SC",serif;letter-spacing:.2em;text-indent:.2em;animation:rise 1.6s backwards;text-shadow:0 0 60px rgba(125,149,255,.7)}
#intro .is{letter-spacing:.35em;color:#9aa6d6;animation:rise 1.8s .5s backwards}
#intro .btn{font-size:18px;padding:14px 44px;animation:rise 1.8s 1s backwards}
#intro small{color:#6f7aa8}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .btn{padding:6px 14px;font-size:13px}.tabs .btn.on{background:#fff;color:#04050a}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg div{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;color:#b9c0dc;font-size:12px}.sg b{display:block;font:900 22px "Noto Serif SC",serif;color:#fff}
.ag{display:grid;gap:8px;max-height:300px;overflow:auto}.ag div{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:9px 14px;opacity:.38}.ag div.on{opacity:1;border-color:var(--glow);box-shadow:0 0 20px rgba(125,149,255,.3)}.ag small{color:#b9c0dc}
.ls{margin:0;padding:0;list-style:none;max-height:300px;overflow:auto}.ls li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:7px 2px;color:#b9c0dc}.ls b{color:#fff}
.me{display:flex;gap:12px;align-items:center}.me img{width:40px;height:40px;border-radius:50%}.me small{color:#8f98ba}

main{padding-bottom:60px}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:#fff;font:inherit;width:100%}.inp:focus{outline:2px solid var(--glow)}
.cnt{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04);padding:10px 14px;max-width:440px;margin:0 auto;width:100%}.cnt.off{display:none}
.ch{display:flex;justify-content:space-between;color:#b9c0dc;font-size:13px;margin-bottom:6px}.ch b{color:#ff6b84}
.cnt table{width:100%;border-collapse:collapse;text-align:center}.cnt th svg{width:16px;height:16px;color:#b9c0dc}
.cnt td{padding:2px 4px;font:700 14px "Noto Sans SC",sans-serif;color:var(--k)}.cnt td.z{opacity:.25}.cnt td:first-child{text-align:left;font-weight:900}
#tick{position:fixed;left:0;right:0;bottom:0;z-index:15;height:calc(34px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(4,5,10,.88);backdrop-filter:blur(8px);border-top:1px solid var(--line);overflow:hidden;display:flex;align-items:center}
#tk{white-space:nowrap;display:flex;animation:mq var(--d,40s) linear infinite;color:#b9c0dc;font-size:13px}
#tk span{padding:0 30px}#tk em{font-style:normal;color:var(--glow);font-weight:700}
@keyframes mq{to{transform:translateX(-50%)}}
.ag .btn{align-self:flex-start;margin-top:6px;padding:4px 14px;font-size:12px}
.card.back.bk-gold{background:radial-gradient(circle at 50% 45%,#9a7612,#1a1203 75%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(255,200,60,.6),inset 0 0 0 .08em rgba(255,215,100,.7)}
.card.back.bk-star{background:radial-gradient(circle at 30% 25%,#7a45f0,#07041a 75%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(150,100,255,.6),inset 0 0 0 .08em rgba(200,170,255,.6)}
.card.back.bk-blood{background:radial-gradient(circle at 50% 45%,#9a1028,#150308 75%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(255,40,70,.6),inset 0 0 0 .08em rgba(255,100,120,.6)}
.card.back.bk-rainbow{background:conic-gradient(from 30deg,#e5313c,#3d63ff,#0b9a62,#b0680f,#e5313c);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(255,255,255,.4),inset 0 0 0 .08em #fff}

.row{min-height:150px}.row .card{--s:14px}
#disc.dz{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:16px;width:min(100%,560px);min-height:78px;margin:8px auto 0;padding:10px;border:2px dashed rgba(255,255,255,.28);border-radius:24px;color:#b9c0dc;font-size:15px}
#disc.dz b{font:900 18px "Noto Serif SC",serif;color:#fff}
#disc.dz.hot{border:2px solid #fff;background:rgba(255,255,255,.14);box-shadow:0 0 40px rgba(255,255,255,.4)}
.sq{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sqb{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:700 15px/1.4 "Noto Sans SC",sans-serif;cursor:pointer;transition:.2s;text-align:center}
.sqb svg{width:44px;height:44px;color:#fff}
.sqb:hover:not(:disabled){background:rgba(255,255,255,.16);transform:translateY(-3px);box-shadow:0 0 26px var(--glow)}
body.haunt .sqb:hover:not(:disabled){box-shadow:0 0 26px #ff2a4d}
.sqb:disabled{opacity:.3;cursor:not-allowed}
.sqb:focus-visible{outline:2px solid var(--glow)}
.hide{align-self:center;font-size:13px;padding:6px 18px}
#pk{display:none;position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:31}
#M.min.on~#pk{display:block}
#M.min{background:transparent;backdrop-filter:none;pointer-events:none}
#M.min .box{display:none}
.mb{max-height:260px;overflow:auto;display:grid;gap:8px;align-content:start}
.mg{border:1px solid var(--line);border-radius:14px;padding:8px 12px;color:#d6dbf2;word-break:break-word}.mg small{color:#6f7aa8;margin-left:8px}
.mi{display:flex;gap:8px}.mi .inp{flex:1}
.kb{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.kc{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.kc label{display:flex;gap:8px;align-items:center;color:#b9c0dc}.kc input[type=color]{width:46px;height:30px;border:0;background:none;padding:0}
.gl{display:flex;gap:6px}.gl .btn{padding:6px 10px}.gl svg{width:22px;height:22px;display:block}.gl .btn.on{background:#fff;color:#04050a}
.up{display:inline-block}
.card.back.bk-aurora{background:linear-gradient(160deg,#0fa38a,#3d2c9a 60%,#07041a);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(60,220,180,.55),inset 0 0 0 .08em rgba(160,255,230,.6)}
.card.back.bk-moss{background:radial-gradient(circle at 50% 45%,#2f7a3a,#06140a 75%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(80,200,100,.5),inset 0 0 0 .08em rgba(160,240,170,.5)}
.card.back.bk-void{background:radial-gradient(circle at 50% 50%,#000 30%,#1a1a24 100%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(255,255,255,.35),inset 0 0 0 .1em #fff}
.card.back.bk-ember{background:radial-gradient(circle at 50% 60%,#ff7a18,#3a0c02 75%);box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(255,120,30,.6),inset 0 0 0 .08em rgba(255,190,120,.6)}
@media(max-width:640px){.pile{width:62px}.stack{--s:9px}.hand{padding-top:36px;min-height:210px}.slot{margin:0 -17px;--s:13px}.slot .card{--s:13px}.row .card{--s:10px;margin-left:-20px}.pill{padding:4px 11px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg"></canvas><div id="fx"></div><div id="haunt"></div><div id="nmv"></div><div id="door"><i></i><b></b></div><div id="toast"></div><div id="tick"><div id="tk"></div></div>
<div id="intro"><div class="it">迷梦人</div><div class="is">ONIRIM · 在八扇门之间逃出梦境</div><button class="btn p" onclick="enter()">进入梦境</button><small>建议戴上耳机 · 含背景音乐与音效</small></div>
<main>
<header><h1><span style="--n:0">迷</span><span style="--n:1">梦</span><span style="--n:2">人</span><small>ONIRIM</small></h1>
<div class="stats"><div class="pill">牌库<b id="nd">0</b></div><div class="pill">弃牌<b id="ng">0</b></div><div class="pill">开门<b id="nw">0/8</b></div><button class="pill ib" id="bm" onclick="tm()" aria-label="音乐">♪</button><button class="pill ib" id="bs" onclick="ts()" aria-label="音效">声</button><button class="pill ib" id="acct" onclick="ME.key?prof():auth()">登录 / 注册</button></div></header>
<div class="doors" id="doors"></div>
<div class="stage"><div class="pile" id="deck"></div>
<div class="table" id="table"><div class="row" id="row"></div><div class="pips" id="run"></div></div></div>
<div class="cnt off" id="cnt"></div>
<div class="msg" id="msg"></div>
<div class="hand" id="hand"></div>
<div class="dz" id="disc"></div>
<div class="bar"><button class="btn p" id="bp">打出</button><button class="btn" id="bd">弃牌</button><button class="btn" onclick="rules()">规则</button><button class="btn" onclick="document.getElementById('cnt').classList.toggle('off')">记牌器</button><button class="btn" onclick="go(newGame)">重新开始</button></div>
</main>
<div id="M" role="dialog" aria-modal="true"></div><button class="btn p" id="pk" onclick="mn(0)">显示提示栏</button>
<script>
const COL={R:['红','#e5313c'],B:['蓝','#3d63ff'],G:['绿','#0b9a62'],N:['棕','#b0680f']};
const SUN={R:9,B:8,G:7,N:6},NAME={sun:'太阳',moon:'月亮',key:'钥匙',door:'门',nm:'噩梦'};
const $=id=>document.getElementById(id);
const ray=(n,a,w,y,l)=>[...Array(n)].map((_,i)=>`<path d="M50 ${y}v${l}" transform="rotate(${i*360/n+a} 50 50)" stroke-width="${w}"/>`).join('');
const star=(x,y,s)=>`<path d="M0-7Q1-1 7 0Q1 1 0 7Q-1 1-7 0Q-1-1 0-7Z" transform="translate(${x} ${y}) scale(${s})" fill="currentColor"/>`;
const ART={
sun:`<circle cx="50" cy="50" r="34" fill="currentColor" opacity=".1"/><circle cx="50" cy="50" r="20" fill="currentColor"/><circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-linecap="round">${ray(8,0,4.5,6,12)}${ray(8,22.5,3,12,6)}</g>`,
moon:`<mask id="mk"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="40" r="27" fill="#000"/></mask><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1" opacity=".3"/><circle cx="46" cy="56" r="30" fill="currentColor" mask="url(#mk)"/>${star(74,66,1.1)}${star(70,22,.7)}${star(86,42,.5)}`,
key:`<circle cx="50" cy="50" r="40" fill="currentColor" opacity=".08"/><g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"><circle cx="50" cy="26" r="14"/><path d="M50 40V88M50 70h13M50 82h9"/></g><circle cx="50" cy="26" r="5" fill="currentColor"/>${star(28,66,.8)}${star(74,52,.6)}`,
door:`<path d="M24 90V44a26 26 0 0 1 52 0v46z" fill="currentColor" opacity=".13"/><path d="M24 90V44a26 26 0 0 1 52 0v46M12 90h76" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M35 90V46a15 15 0 0 1 30 0v44" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="58" cy="64" r="3.5" fill="currentColor"/><path d="M50 10v6M50 31v-6" stroke="currentColor" stroke-width="2.5"/>`,
nm:`<path d="M6 50Q50 8 94 50Q50 92 6 50Z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="50" cy="50" r="18" fill="#3d63ff"/><circle cx="50" cy="50" r="8" fill="#000"/><circle cx="45" cy="45" r="3" fill="#fff"/><path d="M50 32v-6M38 36l-6-5M62 36l6-5M20 56q-8 10-14 8M80 56q8 10 14 8M30 70q-4 12-12 14M70 70q4 12 12 14M16 40q6-6 10-4M84 40q-6-6-10-4" stroke="#ff2a4d" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="50" cy="50" r="18" fill="none" stroke="#ff2a4d" stroke-width="2"/><g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"><path d="M50 4v10M22 14l5 8M78 14l-5 8"/></g>`};
const svg=(t,c='art')=>`<svg class="${c}" viewBox="0 0 100 100">${ART[t]}</svg>`;
const card=(c,x='')=>c.t=='nm'?`<div class="card nm ${x}">${svg('nm')}<div class="cn">噩梦</div></div>`:`<div class="card ${x}" style="--k:${COL[c.c][1]}"><div class="ix">${COL[c.c][0]}${svg(c.t,'')}</div>${svg(c.t)}<div class="cn">${NAME[c.t]}</div><div class="ix r">${COL[c.c][0]}${svg(c.t,'')}</div></div>`;
const back=()=>`<div class="card back">${svg('moon')}</div>`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S,done,uid=0;
const msg=t=>{S.m=t;$('msg').textContent=t};
const cn=c=>COL[c][0]+'色';
const fx=c=>{document.body.classList.remove('flash','dark','shake');void document.body.offsetWidth;document.body.classList.add(...c.split(' '))};

function modal(h){return new Promise(r=>{$('M').dataset.prof='';$('M').classList.remove('min');$('M').innerHTML=`<div class="box">${h}</div>`;$('M').classList.add('on');done=v=>{$('M').classList.remove('on');r(v)}})}
const ask=(t,p,o)=>modal(`<h2>${t}</h2><p>${p}</p><div class="sq">${o.map((x,i)=>`<button class="sqb" ${x.off?'disabled':''} onclick="done(${i})">${x.i?svg(x.i,''):''}<span>${x.t||x}</span></button>`).join('')}</div><button class="btn hide" onclick="mn(1)">隐藏提示栏</button>`);
const mn=v=>$('M').classList.toggle('min',!!v);
function rules(){modal(`<h2>规则</h2><ul><li>在牌库抽完前打开全部 8 扇门（每色 2 扇）。</li><li>把手牌拖到中央出牌，拖到右侧弃牌堆弃牌，然后补到 5 张。</li><li>不能连续打出相同符号的牌。</li><li>连续打出 3 张同色牌，打开该色一扇门。</li><li>弃掉钥匙触发预言：看牌库顶 5 张，丢 1 张，其余自选顺序放回。</li><li>抽到门：可弃同色钥匙开门，否则暂存，补完牌后洗回牌库。</li><li>抽到噩梦：弃一把钥匙、收回一扇门、弃牌库顶 5 张，或弃掉全部手牌。</li></ul><button class="btn p" onclick="done()">关闭</button>`)}

function newGame(){
 const d=[];
 for(const c in COL){for(let i=0;i<SUN[c];i++)d.push({t:'sun',c});for(let i=0;i<4;i++)d.push({t:'moon',c});for(let i=0;i<3;i++)d.push({t:'key',c});for(let i=0;i<2;i++)d.push({t:'door',c})}
 for(let i=0;i<10;i++)d.push({t:'nm'});
 d.forEach(x=>x.id=++uid);
 S={deck:shuffle(d),disc:[],limbo:[],hand:[],row:[],doors:[],sel:null,run:0,rc:null,last:null,busy:false,over:false,m:'',seen:new Set(),ds:{},nmc:0,pc:0,turns:0};
 msg('把手牌拖到中央出牌，拖到右侧弃牌堆弃牌。');
 return refill();
}
const draw=()=>{if(!S.deck.length)throw'lose';return S.deck.shift()};
const open=c=>{S.doors.push(c);ST.td=(ST.td||0)+1;if(ST.td>=30)ach('doors30');unlockFx(c);if(new Set(S.doors).size==4)ach('four');if(S.doors.length==8){render();throw'win'}};

async function refill(){
 while(S.hand.length<5){
  const c=draw();
  if(c.t=='door'){
   const k=S.hand.find(x=>x.t=='key'&&x.c==c.c);
   render();
   if(k&&await ask('抽到'+cn(c.c)+'的门','你有一把'+cn(c.c)+'钥匙，要用它开门吗？',['用钥匙开门','不开，暂存门'])==0){
    S.hand.splice(S.hand.indexOf(k),1);S.disc.push(k);open(c.c);msg('用钥匙打开了'+cn(c.c)+'的门。');render();await wait(1200);
   }else{S.limbo.push(c);msg('一扇'+cn(c.c)+'的门被暂存，补完牌后洗回牌库。')}
  }else if(c.t=='nm'){S.disc.push(c);S.nmc++;render();await haunt(c);await nightmare();endHaunt();if(S.nmc>=5)ach('surv');if(S.nmc>=8)ach('dead')}
  else{S.hand.push(c);snd('deal')}
  render();await wait(130);
 }
 if(S.hand.filter(x=>x.t=='key').length>=4)ach('hoard');S.deck=shuffle(S.deck.concat(S.limbo));S.limbo=[];
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function nightmare(){
 const keys=S.hand.filter(x=>x.t=='key');
 const i=await ask('噩梦降临','你必须付出一种代价：',[{t:'弃掉一把钥匙',i:'key',off:!keys.length},{t:'收回一扇已开的门',i:'door',off:!S.doors.length},{t:'翻开牌库顶 5 张并弃掉',i:'nm'},{t:'弃掉全部手牌重抽',i:'moon'}]);
 if(i==0){
  let k=keys[0];
  if(keys.length>1){const j=await ask('弃掉哪把钥匙？','',keys.map(x=>cn(x.c)+'钥匙'));k=keys[j]}
  S.hand.splice(S.hand.indexOf(k),1);S.disc.push(k);msg('噩梦：弃掉了一把'+cn(k.c)+'钥匙。');
 }else if(i==1){
  const u=[...new Set(S.doors)];let c=u[0];
  if(u.length>1){const j=await ask('收回哪种颜色的门？','',u.map(cn));c=u[j]}
  S.doors.splice(S.doors.indexOf(c),1);S.limbo.push({t:'door',c,id:++uid});msg('噩梦：一扇'+cn(c)+'的门被收回。');
 }else if(i==2){
  for(let n=0;n<5&&S.deck.length;n++){const c=S.deck.shift();(c.t=='door'?S.limbo:S.disc).push(c)}
  msg('噩梦：牌库顶 5 张被翻开丢弃。');
 }else{S.disc.push(...S.hand);S.hand=[];msg('噩梦：手牌全部丢弃，重新补牌。')}
}

async function prophecy(){
 const top=S.deck.splice(0,5);if(!top.length)return;
 const grid=(t,p)=>modal(`<h2>${t}</h2><p>${p}</p><button class="btn hide" onclick="mn(1)">隐藏提示栏</button><div class="pr">${top.map((c,i)=>`<div tabindex="0" onclick="done(${i})" onkeydown="if(event.key=='Enter')done(${i})">${card(c)}</div>`).join('')}</div>`);
 S.pc++;snd('magic');if(S.pc>=3)ach('seer');const p=await grid('预言','这是牌库顶的牌。点击一张丢弃。');
 const d=top.splice(p,1)[0];(d.t=='door'?S.limbo:S.disc).push(d);
 const ord=[];
 while(top.length>1){const k=await grid('排序','点击你想最先抽到的牌（第 '+(ord.length+1)+' 张）。');ord.push(top.splice(k,1)[0])}
 S.deck.unshift(...ord,...top);msg('预言完成：丢弃一张，其余按你的顺序放回牌库顶。');
}

async function act(type){
 const c=S.hand[S.sel];if(!c)return;S.turns++;
 S.hand.splice(S.sel,1);S.sel=null;
 if(type=='play'){
  S.row.push(c);snd('play');S.last=c.t;
  if(S.rc==c.c)S.run++;else{S.rc=c.c;S.run=1}
  msg('打出了'+cn(c.c)+NAME[c.t]+'。');
  if(S.run==3){
   const i=S.deck.findIndex(x=>x.t=='door'&&x.c==c.c);
   render();await wait(350);
   if(i>=0){S.deck.splice(i,1);S.deck=shuffle(S.deck);open(c.c);ach('run');S.rd=(S.rd||0)+1;if(S.rd>=3)ach('chain');msg('三连'+cn(c.c)+'！'+cn(c.c)+'的门打开了。');render();await wait(1200)}
   else msg('三连'+cn(c.c)+'，但牌库里已没有该色的门。');
   S.run=0;S.rc=null;
  }
 }else{
  S.disc.push(c);snd('disc');msg('弃掉了'+(c.t=='nm'?'':cn(c.c))+NAME[c.t]+'。');
  render();
  if(c.t=='key')await prophecy();
 }
 await refill();
}

async function go(f){
 if(f!==newGame&&(!S||S.busy||S.over))return;
 try{if(f===newGame){await newGame()}else{S.busy=true;render();await f()}}
 catch(e){
  if(e=='win'||e=='lose'){S.over=true;render();const r=await finish(e=='win');await wait(e=='win'?1600:300);snd(e=='win'?'win':'lose');
   await modal(e=='win'?`<h2>八扇门全部打开</h2><p>你逃出了迷宫，牌库还剩 ${S.deck.length} 张。<br>得分 ${r.score}${r.nb?'（新纪录！）':''}</p><button class="btn p" onclick="done()">再来一局</button>`:`<h2>牌库耗尽</h2><p>你打开了 ${S.doors.length} 扇门，梦境将你吞没。<br>得分 ${r.score}${r.nb?'（新纪录！）':''}</p><button class="btn p" onclick="done()">再来一局</button>`);
   S=null;return go(newGame)}
  throw e}
 S.busy=false;render();
}

function render(){
 $('nd').textContent=S.deck.length;cntUI();$('ng').textContent=S.disc.length;$('nw').textContent=S.doors.length+'/8';
 $('doors').innerHTML=Object.keys(COL).map(c=>`<div class="dc" style="--k:${COL[c][1]}">${[0,1].map(j=>{const on=S.doors.filter(x=>x==c).length>j,k=c+j,nw=on&&!S.ds[k];S.ds[k]=on;return`<div class="arch ${on?'on':''} ${nw?'new':''}">${on?svg('door',''):''}</div>`}).join('')}</div>`).join('');
 $('deck').innerHTML=S.deck.length?`<div class="stack" style="--s:15px">${[2,1,0].map(i=>`<div class="card back ${bkn()}" style="--i:${i};${bks()}">${bkg()}</div>`).join('')}</div><span><b>${S.deck.length}</b>牌库</span>`:'<span>牌库已空</span>';
 const dn=S.disc.length;$('disc').innerHTML=`<span>拖到这里弃牌</span><b>已弃 ${dn}</b>`;
 $('row').innerHTML=S.row.length?S.row.slice(-4).map(c=>{const n=!S.seen.has(c.id);S.seen.add(c.id);return card(c,n?'pop':'')}).join(''):'<div class="hint">梦境序列还空着<br>把一张手牌拖到这里</div>';
 $('run').innerHTML=S.rc?`<span>${cn(S.rc)}连击</span>`+[0,1,2].map(i=>`<i class="${i<S.run?'on':''}" style="--k:${COL[S.rc][1]}"></i>`).join(''):'';
 const n=S.hand.length,mid=(n-1)/2;let dl=0;
 $('hand').innerHTML=S.hand.map((c,i)=>{const nw=!S.seen.has(c.id);S.seen.add(c.id);return`<div class="slot ${nw?'deal':''} ${S.sel==i?'sel':''} ${c.t==S.last?'bad':''}" data-i="${i}" tabindex="0" style="--r:${(i-mid)*5}deg;--y:${Math.pow(i-mid,2)*5}px;--d:${nw?dl++*.09:0}s">${card(c)}</div>`}).join('');
 document.querySelectorAll('.slot').forEach(bind);
 const c=S.hand[S.sel];
 $('bp').disabled=!c||S.busy||c.t==S.last;$('bd').disabled=!c||S.busy;
 $('bd').textContent=c&&c.t=='key'?'弃牌并预言':'弃牌';
 $('msg').textContent=c&&c.t==S.last?'不能连续打出两张「'+NAME[c.t]+'」，可以弃牌。':S.m;
}

function zone(ev){const e=document.elementsFromPoint(ev.clientX,ev.clientY);return e.some(x=>x.closest('#table'))?'play':e.some(x=>x.closest('#disc'))?'disc':null}
function bind(el){
 const i=+el.dataset.i;
 el.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();if(!S.busy&&!S.over){S.sel=S.sel==i?null:i;render()}}};
 el.onpointerdown=e=>{
  if(S.busy||S.over||e.button>0)return;
  const sx=e.clientX,sy=e.clientY;let drag=false;
  el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{
   const dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(!drag&&Math.hypot(dx,dy)>8){drag=true;S.sel=i;snd('tick');el.classList.add('drag')}
   if(drag){el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg) scale(1.1)`;const z=zone(ev);$('table').classList.toggle('hot',z=='play');$('disc').classList.toggle('hot',z=='disc')}
  };
  el.onpointerup=ev=>{
   el.onpointermove=el.onpointerup=null;
   $('table').classList.remove('hot');$('disc').classList.remove('hot');
   if(!drag){S.sel=S.sel==i?null:i;snd('tick');render();return}
   const z=zone(ev),c=S.hand[i];
   if(z=='play'&&c.t==S.last){$('table').classList.add('no');setTimeout(()=>$('table').classList.remove('no'),500);msg('不能连续打出两张「'+NAME[c.t]+'」。');render()}
   else if(z=='play')go(()=>act('play'));
   else if(z=='disc')go(()=>act('discard'));
   else render();
  };
 };
}
$('bp').onclick=()=>go(()=>act('play'));
$('bd').onclick=()=>go(()=>act('discard'));

const cv=$('bg'),cx=cv.getContext('2d');let W,H;const P=[];
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<80;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,v:Math.random()*.00005+.00002,a:Math.random()});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function f(t){cx.clearRect(0,0,W,H);for(const p of P){p.y-=p.v*16;if(p.y<0)p.y=1;cx.globalAlpha=.2+.5*Math.abs(Math.sin(t/1800+p.a*9));cx.fillStyle=document.body.classList.contains('haunt')?'#ff3355':p.a>.7?'#7d95ff':'#fff';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,7);cx.fill()}requestAnimationFrame(f)})(0);
/* ===== audio ===== */
const A={c:null,m:true,s:true};
function ainit(){
 if(A.c)return;
 const c=A.c=new(window.AudioContext||window.webkitAudioContext)();
 A.out=c.createGain();A.out.connect(c.destination);
 const L=c.sampleRate*3,ir=c.createBuffer(2,L,c.sampleRate);
 for(let k=0;k<2;k++){const d=ir.getChannelData(k);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}
 const rv=c.createConvolver();rv.buffer=ir;const rg=c.createGain();rg.gain.value=.6;rv.connect(rg);rg.connect(A.out);
 A.mus=c.createGain();A.mus.gain.value=.5;A.mus.connect(A.out);A.mus.connect(rv);
 A.sx=c.createGain();A.sx.gain.value=.9;A.sx.connect(A.out);const sg=c.createGain();sg.gain.value=.35;A.sx.connect(sg);sg.connect(rv);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.nb=nb;
 padLoop();setInterval(padLoop,8000);bellLoop();
}
const CH=[[55,110,165,220,261.6],[43.65,87.3,130.8,174.6,261.6],[65.4,130.8,196,261.6,329.6],[49,98,146.8,196,246.9]];let ci=0;
function padLoop(){
 const c=A.c,t=c.currentTime,ch=CH[ci++%4];
 ch.forEach((f,i)=>[-6,6].forEach(dt=>{
  const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type=i<2?'sine':'triangle';o.frequency.value=f;o.detune.value=dt;lp.type='lowpass';lp.frequency.value=700;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05/(1+i*.3),t+3);g.gain.linearRampToValueAtTime(0,t+9);
  o.connect(lp);lp.connect(g);g.connect(A.mus);o.start(t);o.stop(t+9.2);
 }));
}
function bellLoop(){
 const P=[523.25,587.33,659.25,783.99,880,1046.5];
 setTimeout(()=>{if(A.m&&!document.hidden)tone(P[Math.random()*6|0]*(Math.random()<.3?.5:1),A.c.currentTime,3.5,{v:.05,to:A.mus});bellLoop()},1800+Math.random()*3500);
}
function tone(f,t,d,o={}){
 const c=A.c,s=c.createOscillator(),g=c.createGain();
 s.type=o.ty||'sine';s.frequency.setValueAtTime(f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(g);g.connect(o.to||A.sx);s.start(t);s.stop(t+d+.05);
}
function noise(t,d,o={}){
 const c=A.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
 s.buffer=A.nb;s.loop=true;fl.type=o.ty||'bandpass';fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.f||2000,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);
 g.gain.setValueAtTime(o.v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(A.sx);s.start(t);s.stop(t+d+.05);
}

async function hashPw(pw,salt){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);

}

async function submitAuth(mode){
 const n=$('un').value.trim(),pw=$('pw').value,e=$('ae');
 if(n.length<2||n.length>16){e.textContent='用户名需要 2-16 个字符';return}
 if(pw.length<6){e.textContent='密码至少 6 位';return}
 e.textContent='处理中…';
 if(LC.ok){
  try{
   const mail=await mailOf(n);let j;
   if(mode=='up'){
    j=await lc('POST','/auth/v1/signup',{email:mail,password:pw,data:{username:n}});
    if(!j.access_token)j=await lc('POST','/auth/v1/token?grant_type=password',{email:mail,password:pw});
   }else j=await lc('POST','/auth/v1/token?grant_type=password',{email:mail,password:pw});
   const nm=(j.user&&j.user.user_metadata&&j.user.user_metadata.username)||n;
   ME={key:j.user.id,name:nm,tok:j.access_token,rtok:j.refresh_token};saveSess();
   toast(mode=='up'?'注册成功，欢迎 '+nm:'欢迎回来，'+nm);
   done();await loadStats();
  }catch(x){e.textContent=lcErr(x)}
  return;
 }
 const k=kOf(n);
 try{
  const a=await getAcct(k);let nm=n;
  if(mode=='up'){
   if(a){e.textContent='用户名已被占用';return}
   const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
   const w=await putAcct(k,{n,s:salt,h:await hashPw(pw,salt)});
   toast(w=='cloud'?'注册成功，账号已保存到云端':'注册成功，账号仅保存在本机');
  }else{
   if(!a||a.h!==await hashPw(pw,a.s)){e.textContent='用户名或密码错误';return}
   nm=a.n;toast('欢迎回来，'+nm);
  }
  ME={key:k,name:nm};
  try{localStorage.setItem('onirim:s',nm)}catch(_){}
  done();await loadStats();
 }catch(x){e.textContent='操作失败，请稍后重试'}
}

 if(/PGRST205|42P01/.test(s))return'数据表不存在，请先在 Supabase 运行建表 SQL';
 if(/42501|row-level security/i.test(s))return'权限策略缺失，请运行建表 SQL';

 const top=LB.slice(0,3).map((r,i)=>`<em>${i+1}</em> ${esc(r.n||'梦行者')} ${r.best}`).join('　');
 const ev=FEED.slice(0,8).map(f=>`<span><em>${esc(f.n)}</em> ${esc(f.x)}</span>`).join('');
 const h=(top?`<span>🏆 实时榜单　${top}</span>`:'')+ev||'<span>欢迎来到迷梦人。打开八扇门，成绩和成就会在这里播报。</span>';
 $('tk').innerHTML=h+h;$('tk').style.setProperty('--d',Math.max(30,h.length/5)+'s');
}
function feed(x){
 const f={t:Date.now(),n:ME.name,x};FEED.unshift(f);tick();
 if(LC.ok&&ME.tok){lc('POST','/rest/v1/feed',{name:ME.name,x,t:f.t},ME.tok,{Prefer:'return=minimal'}).catch(()=>{});return}
 if(DB&&DBW&&ME.key){try{DB.doc('feed/f'+(f.t%30)).set(f).catch(()=>{})}catch(e){}}
}

function cntUI(){
 const n={};S.deck.forEach(c=>{const k=c.t=='nm'?'nm':c.c+c.t;n[k]=(n[k]||0)+1});
 const T=['sun','moon','key','door'];
 $('cnt').innerHTML=`<div class="ch"><span>记牌器</span><span>牌库 ${S.deck.length} 张 · 噩梦 <b>${n.nm||0}</b></span></div><table><tr><td></td>${T.map(t=>`<th>${svg(t,'')}</th>`).join('')}</tr>${Object.keys(COL).map(c=>`<tr style="--k:${COL[c][1]}"><td>${COL[c][0]}</td>${T.map(t=>`<td class="${n[c+t]?'':'z'}">${n[c+t]||0}</td>`).join('')}</tr>`).join('')}</table>`;
}
let MT=0,LASTMSG=0,CB=null;
const bkCard=b=>`<div class="card back bk-custom" style="font-size:15px;${bkBg(b)}">${b.img?'':svg(b.g)}</div>`;
function bkTabHTML(){
 CB=CB||cbClean(ST.cbk);
 const unl=ACH.filter(a=>a[3]=='back'&&ST.ach[a[0]]);
 return `<div class="kb"><div id="cbw">${bkCard(CB)}</div><div class="kc"><label>主色<input type="color" id="c1" value="${CB.c1}" oninput="cbSet('c1',this.value)"></label><label>副色<input type="color" id="c2" value="${CB.c2}" oninput="cbSet('c2',this.value)"></label><div class="gl">${['moon','sun','key','door','nm'].map(g=>`<button class="btn ${CB.g==g?'on':''}" onclick="cbSet('g','${g}')">${svg(g,'')}</button>`).join('')}</div><label class="btn up">上传图片<input type="file" accept="image/*" hidden onchange="cbImg(this)"></label><button class="btn" onclick="cbSet('img','')">移除图片</button><button class="btn p" onclick="cbSave()">保存并装备</button></div></div><div class="tabs"><button class="btn ${!ST.back?'on':''}" onclick="eq('')">默认</button>${ST.cbk?`<button class="btn ${ST.back=='custom'?'on':''}" onclick="eq('custom')">我的牌背</button>`:''}${unl.map(a=>`<button class="btn ${ST.back==a[4]?'on':''}" onclick="eq('${a[4]}')">${BK[a[4]]}</button>`).join('')}</div>`;
}
function cbSet(k,v){CB[k]=v;if(k=='g'||k=='img')prof('k');else $('cbw').innerHTML=bkCard(CB)}
function cbImg(i){
 const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas');c.width=140;c.height=200;const x=c.getContext('2d'),s=Math.max(140/im.width,200/im.height),w=im.width*s,h=im.height*s;
  x.drawImage(im,(140-w)/2,(200-h)/2,w,h);CB.img=c.toDataURL('image/jpeg',.72);prof('k');
 };im.src=r.result};r.readAsDataURL(f);
}
function cbSave(){ST.cbk=cbClean(CB);ST.back='custom';persist();ach('deco');acctUI();if(S)render();toast('已装备自定义牌背');prof('k')}
function eq(id){ST.back=id;persist();if(S)render();prof('k')}
function msgHTML(){return`<div class="mb" id="mbx"><p>读取中…</p></div><div class="mi"><input class="inp" id="mt" maxlength="120" placeholder="写点什么（最多 120 字）" onkeydown="if(event.key=='Enter')sendMsg()"><button class="btn p" onclick="sendMsg()">发送</button></div>`}
async function loadMsgs(){
 const e=$('mbx');if(!e){clearInterval(MT);MT=0;return}
 if(!LC.ok){e.innerHTML='<p>留言板需要连接云端。</p>';return}
 try{
  const r=await lc('GET','/rest/v1/messages?select=name,text,t&order=id.desc&limit=30');
  e.innerHTML=r.length?r.map(m=>`<div class="mg"><b>${esc(m.name)}</b><small>${new Date(m.t).toLocaleString()}</small><div>${esc(m.text)}</div></div>`).join(''):'<p>还没有留言，来写第一条吧。</p>';
 }catch(x){e.innerHTML='<p>'+esc(lcErr(x))+'（请先运行 supabase-update.sql）</p>'}
}
async function sendMsg(){
 const i=$('mt');if(!i||!ME.tok)return;const t=i.value.trim();if(!t)return;
 if(!LC.ok){toast('留言板需要连接云端');return}
 if(Date.now()-LASTMSG<3000){toast('发送太快了，稍等一下');return}
 LASTMSG=Date.now();i.value='';
 try{await lc('POST','/rest/v1/messages',{name:ME.name,text:t.slice(0,120),t:Date.now()},ME.tok,{Prefer:'return=minimal'});ach('msg');loadMsgs()}
 catch(x){toast('发送失败：'+lcErr(x))}
}
function prof(tab){
 if(!ME.key){auth('in');return}
 const m=$('M');if(m.classList.contains('on')&&!m.dataset.prof)return;
 tab=tab||'s';
 const tabs=[['s','战绩'],['a','成就'],['k','牌背'],['h','历史'],['b','排行榜'],['m','留言板']].map(([k,n])=>`<button class="btn ${k==tab?'on':''}" onclick="prof('${k}')">${n}</button>`).join('');
 let body='';
 if(tab=='s'){const wr=ST.games?Math.round(ST.wins/ST.games*100):0;body=`<div class="sg"><div><b>${ST.games}</b>对局</div><div><b>${ST.wins}</b>胜场</div><div><b>${wr}%</b>胜率</div><div><b>${ST.best}</b>最高分</div><div><b>${ST.bd}</b>最多开门</div><div><b>${ST.fast}</b>最多剩余牌</div></div>`}
 if(tab=='a')body=`<p>已解锁 ${ACH.filter(a=>ST.ach[a[0]]).length}/${ACH.length}</p><div class="ag">${ACH.map((a,i)=>{const on=ST.ach[a[0]];return`<div class="${on?'on':''}"><b>${on?'★ ':'☆ '}${a[1]}</b><small>${a[2]} · 奖励：${rw(a)}</small>${on?`<button class="btn" onclick="equip(${i})">${(a[3]=='title'?ST.title:ST.back)==a[4]?'卸下':'装备'}</button>`:''}</div>`}).join('')}</div>`;
 if(tab=='k')body=bkTabHTML();
 if(tab=='h')body=ST.h.length?`<ul class="ls">${ST.h.map(h=>`<li><span>${new Date(h.t).toLocaleString()}　${h.w?'胜利':'失败'}　开门 ${h.d}</span><b>${h.s}</b></li>`).join('')}</ul>`:'<p>还没有对局记录。</p>';
 if(tab=='b')body='<div id="lbx">'+lbHTML()+'</div>';
 if(tab=='m')body=msgHTML();
 const st=LC.ok?'Supabase 云端同步中':DB?(DBW?'云端同步中':'云端只读 · 战绩保存在本机'):'战绩保存在本机';
 modal(`<div class="me"><div><b>${ST.title?esc('「'+ST.title+'」'):''}${esc(ME.name)}</b><br><small>${st}</small></div></div><div class="tabs">${tabs}</div>${body}<button class="btn p" onclick="done()">关闭</button><button class="btn" onclick="diag()">云端诊断</button><button class="btn" onclick="logout()">退出登录</button>`);
 m.dataset.prof=1;
 if(tab=='m'){loadMsgs();clearInterval(MT);MT=setInterval(loadMsgs,5000)}
}

async function initAcct(){
 if(lcOn()){try{await lc('GET','/rest/v1/scores?select=uid&limit=1');LC.ok=true}catch(x){LC.ok=!!(x&&x.status&&x.status<500&&x.status!=401)}}
 if(!LC.ok){try{if(window.claude)DB=await claude.use('db')}catch(e){}}
 try{
  if(LC.ok){const s=JSON.parse(localStorage.getItem('onirim:lc')||'null');if(s&&s.tok)ME={key:s.key,name:s.name,tok:s.tok,rtok:s.rtok}}
  else{const s=localStorage.getItem('onirim:s');if(s)ME={key:kOf(s),name:s}}
 }catch(e){}
 await loadStats();watch();tick();
}
ST=loadLocal();initAcct();

</script></body></html>
