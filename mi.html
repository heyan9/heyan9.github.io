<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迷梦人 Onirim</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050a;--line:rgba(255,255,255,.14);--blue:#3355ff;--glow:#7d95ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 "Noto Sans SC",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 0,rgba(51,85,255,.4),transparent 70%),radial-gradient(50% 35% at 50% 100%,rgba(51,85,255,.2),transparent 70%);animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.55}}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:20}
body.flash #fx{background:radial-gradient(circle,#fff,rgba(125,149,255,.6) 40%,transparent 75%);animation:fl .9s ease-out}
body.dark #fx{background:radial-gradient(circle,transparent 30%,#000 100%);animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
body.shake main{animation:sh .5s}
@keyframes sh{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
main{position:relative;max-width:1040px;margin:0 auto;padding:18px 18px 28px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font:900 clamp(34px,6vw,54px)/1 "Noto Serif SC",serif;letter-spacing:.14em;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
h1 span{display:inline-block;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n)*.18s)}
h1 small{font:700 11px "Noto Sans SC";letter-spacing:.55em;opacity:.55;margin-left:14px;animation:rise 1.4s .7s backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(10px)}}
.stats{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border-radius:999px;padding:5px 16px;display:flex;gap:8px;align-items:baseline;font-size:13px;color:#b9c0dc}
.pill b{font:900 20px "Noto Serif SC",serif;color:#fff}
.doors{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.dc{display:flex;gap:7px}
.arch{width:32px;height:44px;border-radius:16px 16px 5px 5px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--k);transition:.4s}
.arch svg{width:20px;height:20px}
.arch.on{border-color:var(--k);background:radial-gradient(circle at 50% 80%,color-mix(in srgb,var(--k) 45%,transparent),transparent 75%);box-shadow:0 0 18px color-mix(in srgb,var(--k) 70%,transparent)}
.arch.new{animation:unlock 1.4s}
@keyframes unlock{0%{transform:scale(.6);box-shadow:0 0 0 0 #fff}40%{transform:scale(1.35);box-shadow:0 0 50px 12px var(--k)}100%{transform:scale(1)}}
.stage{display:flex;gap:14px;align-items:stretch}
.table{flex:1;min-height:210px;border-radius:26px;border:1.5px dashed rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:16px 10px;transition:.25s;min-width:0}
.table.hot{border:1.5px solid var(--glow);background:rgba(51,85,255,.14);box-shadow:inset 0 0 50px rgba(51,85,255,.5),0 0 34px rgba(51,85,255,.4)}
.table.no{border:1.5px solid #ff4d5e;box-shadow:inset 0 0 50px rgba(255,77,94,.4)}
.row{display:flex;justify-content:center;max-width:100%;padding:4px 14px;min-height:130px;align-items:center}
.row .card{--s:12px;margin-left:-16px}.row .card:first-child{margin-left:0}
.hint{color:#8f98ba;text-align:center}
.pips{display:flex;gap:7px;align-items:center;font-size:12px;color:#8f98ba}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid #8f98ba}
.pips i.on{background:var(--k);border-color:var(--k);box-shadow:0 0 10px var(--k)}
.pile{width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;color:#8f98ba;text-align:center;border-radius:22px;transition:.25s}
.pile b{display:block;font:900 20px "Noto Serif SC",serif;color:#fff}
.stack{position:relative;width:5.6em;height:8em;font-size:var(--s)}
.stack .card{--s:inherit;position:absolute;left:0;top:0;width:100%;height:100%;font-size:inherit;transform:translate(calc(var(--i)*-2px),calc(var(--i)*-2px))}
#disc{border:1.5px dashed rgba(255,255,255,.22);padding:14px 4px}
#disc.hot{border:1.5px solid #fff;background:rgba(255,255,255,.1);box-shadow:0 0 30px rgba(255,255,255,.3)}
.hand{display:flex;justify-content:center;padding:44px 6px 6px;min-height:250px}
.slot{margin:0 -9px;transform:translateY(var(--y)) rotate(var(--r));transform-origin:50% 130%;transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:none;cursor:grab;outline:0}
.slot:hover,.slot:focus-visible{transform:translateY(calc(var(--y) - 28px)) scale(1.07);z-index:5}
.slot.sel{transform:translateY(-40px) scale(1.1);z-index:6}
.slot.sel .card{box-shadow:0 0 0 2px var(--glow),0 0 36px rgba(125,149,255,.8),0 1em 2em rgba(0,0,0,.7)}
.slot.drag{transition:none;z-index:50;cursor:grabbing}
.slot.deal{animation:deal .7s var(--d) cubic-bezier(.2,.9,.25,1) backwards}
@keyframes deal{from{opacity:0;transform:translate(-45vw,-40vh) rotate(-50deg) scale(.4)}}
.slot.bad .card{filter:grayscale(.8) brightness(.8)}
.card{--k:#111;font-size:var(--s,17px);width:7em;height:10em;border-radius:1em;background:linear-gradient(155deg,#fff,#e9edf8);color:var(--k);position:relative;display:grid;place-items:center;flex:none;user-select:none;box-shadow:0 .1em .2em rgba(0,0,0,.4),0 .8em 1.6em -.3em rgba(0,0,0,.75),inset 0 0 0 .08em #fff}
.card:before{content:"";position:absolute;inset:.45em;border-radius:.65em;border:.06em solid color-mix(in srgb,var(--k) 35%,transparent)}
.card .art{width:5em;height:5em;filter:drop-shadow(0 .2em .5em color-mix(in srgb,var(--k) 45%,transparent))}
.ix{position:absolute;top:.8em;left:.85em;display:flex;flex-direction:column;align-items:center;gap:.2em;font:900 .95em/1 "Noto Serif SC",serif}
.ix svg{width:1em;height:1em}
.ix.r{top:auto;left:auto;bottom:.8em;right:.85em;transform:rotate(180deg)}
.cn{position:absolute;bottom:.85em;left:0;right:0;text-align:center;font-size:.68em;font-weight:700;letter-spacing:.35em;text-indent:.35em;color:#1a2040;opacity:.7}
.card.nm,.card.back{background:radial-gradient(circle at 50% 40%,#18226a,#05060d 72%);color:#fff;box-shadow:0 .8em 1.6em -.3em #000,0 0 1.6em rgba(51,85,255,.55),inset 0 0 0 .08em rgba(255,255,255,.35)}
.nm:before,.back:before{border-color:rgba(255,255,255,.3)}
.nm .cn{color:#fff}
.back .art{width:2.6em;height:2.6em;opacity:.8}
.pop{animation:pop .6s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{0%{opacity:0;transform:translateY(-70px) scale(1.4) rotate(-8deg);filter:brightness(2)}100%{opacity:1}}
.msg{text-align:center;color:#c6cdea;min-height:24px;transition:.3s}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:700 14px "Noto Sans SC",sans-serif;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;padding:10px 24px;cursor:pointer;transition:.2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14);transform:translateY(-2px)}
.btn.p{background:#fff;color:#04050a;border-color:#fff}
.btn.p:hover:not(:disabled){box-shadow:0 0 28px rgba(125,149,255,.8);background:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
#M{position:fixed;inset:0;background:rgba(2,3,8,.75);backdrop-filter:blur(10px);display:none;place-items:center;padding:16px;z-index:30;overflow:auto}
#M.on{display:grid}
.box{background:linear-gradient(180deg,#10142a,#080a14);border:1px solid var(--line);border-radius:26px;padding:28px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 80px rgba(51,85,255,.35);animation:mi .35s cubic-bezier(.2,.9,.25,1)}
@keyframes mi{from{opacity:0;transform:scale(.9) translateY(20px)}}
.box h2{margin:0;font:900 28px "Noto Serif SC",serif}
.box p{margin:0;color:#b9c0dc}
.box ul{margin:0;padding-left:20px;color:#b9c0dc}.box li{margin:4px 0}
.pr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px}
.pr .card{--s:12px;cursor:pointer;transition:.2s}.pr .card:hover{transform:translateY(-8px);box-shadow:0 0 30px var(--glow)}
@media(max-width:640px){.pile{width:62px}.stack{--s:9px}.hand{padding-top:36px;min-height:210px}.slot{margin:0 -17px;--s:13px}.slot .card{--s:13px}.row .card{--s:10px;margin-left:-20px}.pill{padding:4px 11px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg"></canvas><div id="fx"></div>
<main>
<header><h1><span style="--n:0">迷</span><span style="--n:1">梦</span><span style="--n:2">人</span><small>ONIRIM</small></h1>
<div class="stats"><div class="pill">牌库<b id="nd">0</b></div><div class="pill">弃牌<b id="ng">0</b></div><div class="pill">开门<b id="nw">0/8</b></div></div></header>
<div class="doors" id="doors"></div>
<div class="stage"><div class="pile" id="deck"></div>
<div class="table" id="table"><div class="row" id="row"></div><div class="pips" id="run"></div></div>
<div class="pile" id="disc"></div></div>
<div class="msg" id="msg"></div>
<div class="hand" id="hand"></div>
<div class="bar"><button class="btn p" id="bp">打出</button><button class="btn" id="bd">弃牌</button><button class="btn" onclick="rules()">规则</button><button class="btn" onclick="go(newGame)">重新开始</button></div>
</main>
<div id="M" role="dialog" aria-modal="true"></div>
<script>
const COL={R:['红','#e5313c'],B:['蓝','#3d63ff'],G:['绿','#0b9a62'],N:['棕','#b0680f']};
const SUN={R:9,B:8,G:7,N:6},NAME={sun:'太阳',moon:'月亮',key:'钥匙',door:'门',nm:'噩梦'};
const $=id=>document.getElementById(id);
const ray=(n,a,w,y,l)=>[...Array(n)].map((_,i)=>`<path d="M50 ${y}v${l}" transform="rotate(${i*360/n+a} 50 50)" stroke-width="${w}"/>`).join('');
const star=(x,y,s)=>`<path d="M0-7Q1-1 7 0Q1 1 0 7Q-1 1-7 0Q-1-1 0-7Z" transform="translate(${x} ${y}) scale(${s})" fill="currentColor"/>`;
const ART={
sun:`<circle cx="50" cy="50" r="34" fill="currentColor" opacity=".1"/><circle cx="50" cy="50" r="20" fill="currentColor"/><circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-linecap="round">${ray(8,0,4.5,6,12)}${ray(8,22.5,3,12,6)}</g>`,
moon:`<mask id="mk"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="40" r="27" fill="#000"/></mask><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1" opacity=".3"/><circle cx="46" cy="56" r="30" fill="currentColor" mask="url(#mk)"/>${star(74,66,1.1)}${star(70,22,.7)}${star(86,42,.5)}`,
key:`<circle cx="50" cy="50" r="40" fill="currentColor" opacity=".08"/><g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"><circle cx="50" cy="26" r="14"/><path d="M50 40V88M50 70h13M50 82h9"/></g><circle cx="50" cy="26" r="5" fill="currentColor"/>${star(28,66,.8)}${star(74,52,.6)}`,
door:`<path d="M24 90V44a26 26 0 0 1 52 0v46z" fill="currentColor" opacity=".13"/><path d="M24 90V44a26 26 0 0 1 52 0v46M12 90h76" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M35 90V46a15 15 0 0 1 30 0v44" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="58" cy="64" r="3.5" fill="currentColor"/><path d="M50 10v6M50 31v-6" stroke="currentColor" stroke-width="2.5"/>`,
nm:`<path d="M6 50Q50 8 94 50Q50 92 6 50Z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="50" cy="50" r="18" fill="#3d63ff"/><circle cx="50" cy="50" r="8" fill="#000"/><circle cx="45" cy="45" r="3" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"><path d="M50 4v10M22 14l5 8M78 14l-5 8"/></g>`};
const svg=(t,c='art')=>`<svg class="${c}" viewBox="0 0 100 100">${ART[t]}</svg>`;
const card=(c,x='')=>c.t=='nm'?`<div class="card nm ${x}">${svg('nm')}<div class="cn">噩梦</div></div>`:`<div class="card ${x}" style="--k:${COL[c.c][1]}"><div class="ix">${COL[c.c][0]}${svg(c.t,'')}</div>${svg(c.t)}<div class="cn">${NAME[c.t]}</div><div class="ix r">${COL[c.c][0]}${svg(c.t,'')}</div></div>`;
const back=()=>`<div class="card back">${svg('moon')}</div>`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S,done,uid=0;
const msg=t=>{S.m=t;$('msg').textContent=t};
const cn=c=>COL[c][0]+'色';
const fx=c=>{document.body.classList.remove('flash','dark','shake');void document.body.offsetWidth;document.body.classList.add(...c.split(' '))};

function modal(h){return new Promise(r=>{$('M').innerHTML=`<div class="box">${h}</div>`;$('M').classList.add('on');done=v=>{$('M').classList.remove('on');r(v)}})}
const ask=(t,p,o)=>modal(`<h2>${t}</h2><p>${p}</p>`+o.map((x,i)=>`<button class="btn ${i?'':'p'}" ${x.off?'disabled':''} onclick="done(${i})">${x.t||x}</button>`).join(''));
function rules(){modal(`<h2>规则</h2><ul><li>在牌库抽完前打开全部 8 扇门（每色 2 扇）。</li><li>把手牌拖到中央出牌，拖到右侧弃牌堆弃牌，然后补到 5 张。</li><li>不能连续打出相同符号的牌。</li><li>连续打出 3 张同色牌，打开该色一扇门。</li><li>弃掉钥匙触发预言：看牌库顶 5 张，丢 1 张，其余自选顺序放回。</li><li>抽到门：可弃同色钥匙开门，否则暂存，补完牌后洗回牌库。</li><li>抽到噩梦：弃一把钥匙、收回一扇门、弃牌库顶 5 张，或弃掉全部手牌。</li></ul><button class="btn p" onclick="done()">关闭</button>`)}

function newGame(){
 const d=[];
 for(const c in COL){for(let i=0;i<SUN[c];i++)d.push({t:'sun',c});for(let i=0;i<4;i++)d.push({t:'moon',c});for(let i=0;i<3;i++)d.push({t:'key',c});for(let i=0;i<2;i++)d.push({t:'door',c})}
 for(let i=0;i<10;i++)d.push({t:'nm'});
 d.forEach(x=>x.id=++uid);
 S={deck:shuffle(d),disc:[],limbo:[],hand:[],row:[],doors:[],sel:null,run:0,rc:null,last:null,busy:false,over:false,m:'',seen:new Set(),ds:{}};
 msg('把手牌拖到中央出牌，拖到右侧弃牌堆弃牌。');
 return refill();
}
const draw=()=>{if(!S.deck.length)throw'lose';return S.deck.shift()};
const open=c=>{S.doors.push(c);fx('flash');if(S.doors.length==8){render();throw'win'}};

async function refill(){
 while(S.hand.length<5){
  const c=draw();
  if(c.t=='door'){
   const k=S.hand.find(x=>x.t=='key'&&x.c==c.c);
   render();
   if(k&&await ask('抽到'+cn(c.c)+'的门','你有一把'+cn(c.c)+'钥匙，要用它开门吗？',['用钥匙开门','不开，暂存门'])==0){
    S.hand.splice(S.hand.indexOf(k),1);S.disc.push(k);open(c.c);msg('用钥匙打开了'+cn(c.c)+'的门。');
   }else{S.limbo.push(c);msg('一扇'+cn(c.c)+'的门被暂存，补完牌后洗回牌库。')}
  }else if(c.t=='nm'){S.disc.push(c);render();fx('shake dark');await nightmare()}
  else S.hand.push(c);
  render();await wait(130);
 }
 S.deck=shuffle(S.deck.concat(S.limbo));S.limbo=[];
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function nightmare(){
 const keys=S.hand.filter(x=>x.t=='key');
 const i=await ask('噩梦降临','你必须付出一种代价：',[{t:'弃掉一把钥匙',off:!keys.length},{t:'收回一扇已开的门',off:!S.doors.length},{t:'翻开牌库顶 5 张并弃掉'},{t:'弃掉全部手牌重抽'}]);
 if(i==0){
  let k=keys[0];
  if(keys.length>1){const j=await ask('弃掉哪把钥匙？','',keys.map(x=>cn(x.c)+'钥匙'));k=keys[j]}
  S.hand.splice(S.hand.indexOf(k),1);S.disc.push(k);msg('噩梦：弃掉了一把'+cn(k.c)+'钥匙。');
 }else if(i==1){
  const u=[...new Set(S.doors)];let c=u[0];
  if(u.length>1){const j=await ask('收回哪种颜色的门？','',u.map(cn));c=u[j]}
  S.doors.splice(S.doors.indexOf(c),1);S.limbo.push({t:'door',c,id:++uid});msg('噩梦：一扇'+cn(c)+'的门被收回。');
 }else if(i==2){
  for(let n=0;n<5&&S.deck.length;n++){const c=S.deck.shift();(c.t=='door'?S.limbo:S.disc).push(c)}
  msg('噩梦：牌库顶 5 张被翻开丢弃。');
 }else{S.disc.push(...S.hand);S.hand=[];msg('噩梦：手牌全部丢弃，重新补牌。')}
}

async function prophecy(){
 const top=S.deck.splice(0,5);if(!top.length)return;
 const grid=(t,p)=>modal(`<h2>${t}</h2><p>${p}</p><div class="pr">${top.map((c,i)=>`<div tabindex="0" onclick="done(${i})" onkeydown="if(event.key=='Enter')done(${i})">${card(c)}</div>`).join('')}</div>`);
 const p=await grid('预言','这是牌库顶的牌。点击一张丢弃。');
 const d=top.splice(p,1)[0];(d.t=='door'?S.limbo:S.disc).push(d);
 const ord=[];
 while(top.length>1){const k=await grid('排序','点击你想最先抽到的牌（第 '+(ord.length+1)+' 张）。');ord.push(top.splice(k,1)[0])}
 S.deck.unshift(...ord,...top);msg('预言完成：丢弃一张，其余按你的顺序放回牌库顶。');
}

async function act(type){
 const c=S.hand[S.sel];if(!c)return;
 S.hand.splice(S.sel,1);S.sel=null;
 if(type=='play'){
  S.row.push(c);S.last=c.t;
  if(S.rc==c.c)S.run++;else{S.rc=c.c;S.run=1}
  msg('打出了'+cn(c.c)+NAME[c.t]+'。');
  if(S.run==3){
   const i=S.deck.findIndex(x=>x.t=='door'&&x.c==c.c);
   render();await wait(350);
   if(i>=0){S.deck.splice(i,1);S.deck=shuffle(S.deck);open(c.c);msg('三连'+cn(c.c)+'！'+cn(c.c)+'的门打开了。')}
   else msg('三连'+cn(c.c)+'，但牌库里已没有该色的门。');
   S.run=0;S.rc=null;
  }
 }else{
  S.disc.push(c);msg('弃掉了'+(c.t=='nm'?'':cn(c.c))+NAME[c.t]+'。');
  render();
  if(c.t=='key')await prophecy();
 }
 await refill();
}

async function go(f){
 if(f!==newGame&&(!S||S.busy||S.over))return;
 try{if(f===newGame){await newGame()}else{S.busy=true;render();await f()}}
 catch(e){
  if(e=='win'||e=='lose'){S.over=true;render();
   await modal(e=='win'?`<h2>八扇门全部打开</h2><p>你逃出了迷宫，牌库还剩 ${S.deck.length} 张。</p><button class="btn p" onclick="done()">再来一局</button>`:`<h2>牌库耗尽</h2><p>你打开了 ${S.doors.length} 扇门，梦境将你吞没。</p><button class="btn p" onclick="done()">再来一局</button>`);
   S=null;return go(newGame)}
  throw e}
 S.busy=false;render();
}

function render(){
 $('nd').textContent=S.deck.length;$('ng').textContent=S.disc.length;$('nw').textContent=S.doors.length+'/8';
 $('doors').innerHTML=Object.keys(COL).map(c=>`<div class="dc" style="--k:${COL[c][1]}">${[0,1].map(j=>{const on=S.doors.filter(x=>x==c).length>j,k=c+j,nw=on&&!S.ds[k];S.ds[k]=on;return`<div class="arch ${on?'on':''} ${nw?'new':''}">${on?svg('door',''):''}</div>`}).join('')}</div>`).join('');
 $('deck').innerHTML=S.deck.length?`<div class="stack" style="--s:15px">${[2,1,0].map(i=>`<div class="card back" style="--i:${i}">${svg('moon')}</div>`).join('')}</div><span><b>${S.deck.length}</b>牌库</span>`:'<span>牌库已空</span>';
 const top=S.disc[S.disc.length-1];
 $('disc').innerHTML=top?`<div style="--s:11px">${card(top)}</div><span><b>${S.disc.length}</b>弃牌堆</span>`:'<span>拖到这里<br>弃牌</span>';
 $('row').innerHTML=S.row.length?S.row.slice(-9).map(c=>{const n=!S.seen.has(c.id);S.seen.add(c.id);return card(c,n?'pop':'')}).join(''):'<div class="hint">梦境序列还空着<br>把一张手牌拖到这里</div>';
 $('run').innerHTML=S.rc?`<span>${cn(S.rc)}连击</span>`+[0,1,2].map(i=>`<i class="${i<S.run?'on':''}" style="--k:${COL[S.rc][1]}"></i>`).join(''):'';
 const n=S.hand.length,mid=(n-1)/2;let dl=0;
 $('hand').innerHTML=S.hand.map((c,i)=>{const nw=!S.seen.has(c.id);S.seen.add(c.id);return`<div class="slot ${nw?'deal':''} ${S.sel==i?'sel':''} ${c.t==S.last?'bad':''}" data-i="${i}" tabindex="0" style="--r:${(i-mid)*5}deg;--y:${Math.pow(i-mid,2)*5}px;--d:${nw?dl++*.09:0}s">${card(c)}</div>`}).join('');
 document.querySelectorAll('.slot').forEach(bind);
 const c=S.hand[S.sel];
 $('bp').disabled=!c||S.busy||c.t==S.last;$('bd').disabled=!c||S.busy;
 $('bd').textContent=c&&c.t=='key'?'弃牌并预言':'弃牌';
 $('msg').textContent=c&&c.t==S.last?'不能连续打出两张「'+NAME[c.t]+'」，可以弃牌。':S.m;
}

function zone(ev){const e=document.elementsFromPoint(ev.clientX,ev.clientY);return e.some(x=>x.closest('#table'))?'play':e.some(x=>x.closest('#disc'))?'disc':null}
function bind(el){
 const i=+el.dataset.i;
 el.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();if(!S.busy&&!S.over){S.sel=S.sel==i?null:i;render()}}};
 el.onpointerdown=e=>{
  if(S.busy||S.over||e.button>0)return;
  const sx=e.clientX,sy=e.clientY;let drag=false;
  el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{
   const dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(!drag&&Math.hypot(dx,dy)>8){drag=true;S.sel=i;el.classList.add('drag')}
   if(drag){el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg) scale(1.1)`;const z=zone(ev);$('table').classList.toggle('hot',z=='play');$('disc').classList.toggle('hot',z=='disc')}
  };
  el.onpointerup=ev=>{
   el.onpointermove=el.onpointerup=null;
   $('table').classList.remove('hot');$('disc').classList.remove('hot');
   if(!drag){S.sel=S.sel==i?null:i;render();return}
   const z=zone(ev),c=S.hand[i];
   if(z=='play'&&c.t==S.last){$('table').classList.add('no');setTimeout(()=>$('table').classList.remove('no'),500);msg('不能连续打出两张「'+NAME[c.t]+'」。');render()}
   else if(z=='play')go(()=>act('play'));
   else if(z=='disc')go(()=>act('discard'));
   else render();
  };
 };
}
$('bp').onclick=()=>go(()=>act('play'));
$('bd').onclick=()=>go(()=>act('discard'));

const cv=$('bg'),cx=cv.getContext('2d');let W,H;const P=[];
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<80;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,v:Math.random()*.00005+.00002,a:Math.random()});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function f(t){cx.clearRect(0,0,W,H);for(const p of P){p.y-=p.v*16;if(p.y<0)p.y=1;cx.globalAlpha=.2+.5*Math.abs(Math.sin(t/1800+p.a*9));cx.fillStyle=p.a>.7?'#7d95ff':'#fff';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,7);cx.fill()}requestAnimationFrame(f)})(0);
go(newGame);
</script></body></html>
