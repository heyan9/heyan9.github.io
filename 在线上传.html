<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>日常记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --bg2:#f5f5f7; --ink:#1d1d1f; --sub:#6e6e73; --faint:#86868b;
  --blue:#0071e3; --blue-h:#0077ed; --green:#34c759; --star:#ff9f0a; --red:#ff3b30;
  --line:rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,113,227,.4)}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* 顶栏 */
.nav{position:sticky;top:0;z-index:30;height:48px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line)}
.nav .wrap{height:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:17px;font-weight:600;letter-spacing:.02em}
.nav-r{display:flex;align-items:center;gap:22px;font-size:13px}
.nav-r a{color:var(--sub);transition:color .2s}
.nav-r a:hover{color:var(--ink)}
.pill{background:var(--blue);color:#fff;border:0;border-radius:980px;padding:4px 14px;font-size:13px;transition:background .2s}
.pill:hover{background:var(--blue-h)}

.warn{display:none;background:#fff8e6;border-radius:14px;padding:14px 18px;margin:20px 0 0;font-size:14px}
.warn code{background:#fff;padding:1px 6px;border-radius:6px}

/* 按钮 */
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:980px;padding:12px 26px;font-size:17px;line-height:1.2;transition:background .2s,transform .2s}
.btn:hover:not(:disabled){background:var(--blue-h)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);font-size:17px;padding:12px 4px}
.link:hover{text-decoration:underline}

/* 入场动画 */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* hero */
.hero{text-align:center;padding:84px 24px 0}
.hero h1{font-size:clamp(52px,9vw,104px);line-height:1.04;font-weight:700;letter-spacing:-.04em;margin:0}
.lead{font-size:clamp(20px,2.6vw,28px);font-weight:500;color:var(--sub);margin:14px 0 0;letter-spacing:-.015em}
.cta{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:28px;flex-wrap:wrap}
.hero-stage{margin:56px auto 0;max-width:1180px}
.hero-card{display:block;position:relative;aspect-ratio:16/10;border-radius:32px;overflow:hidden;background:var(--bg2);will-change:transform;transform-origin:50% 0}
.hero-card img{width:100%;height:100%;object-fit:cover;display:block}
.hero-tag{position:absolute;left:20px;bottom:20px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:980px;padding:7px 16px;font-size:14px;font-weight:500}
.hero-empty{display:grid;place-items:center;height:100%;color:var(--faint);font-size:22px;font-weight:500}

/* 灰色分区 */
.band{background:var(--bg2);margin-top:96px;padding:88px 0 96px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px}
.sec h2{font-size:clamp(32px,4.4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:0}
.sec span{color:var(--sub);font-size:17px}

/* 相册 bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(190px,21vw,270px);gap:16px;grid-auto-flow:dense}
.bc{position:relative;display:block;border-radius:28px;overflow:hidden;background:#e5e5ea;color:#fff;isolation:isolate}
.bc.big{grid-column:span 2;grid-row:span 2}
.bc.wide{grid-column:span 2}
.bc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);z-index:-2}
.bc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.58),rgba(0,0,0,0) 55%);z-index:-1}
.bc:hover img{transform:scale(1.05)}
.bc .tx{position:absolute;left:22px;right:22px;bottom:18px}
.bc h3{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.bc.big h3{font-size:34px}
.bc .dt{font-size:14px;opacity:.86;margin-top:2px}
.chip-t{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.72);color:var(--ink);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:980px;padding:3px 12px;font-size:13px;font-weight:500}
.chip-t.r{left:auto;right:14px;color:#c97800}
.empty{color:var(--faint);padding:80px 0;text-align:center;font-size:21px;font-weight:500;grid-column:1/-1}

/* 相册详情 */
.back{background:none;border:0;color:var(--blue);font-size:17px;padding:0;margin-top:32px}
.back:hover{text-decoration:underline}
.ahead{padding:20px 0 30px}
.adate{color:var(--sub);font-size:17px;font-weight:500}
.atitle{display:block;width:100%;border:0;background:none;font:inherit;font-size:clamp(40px,6.4vw,72px);line-height:1.1;font-weight:700;letter-spacing:-.035em;color:var(--ink);padding:2px 0;margin:2px 0 4px;border-radius:14px;transition:background .2s,box-shadow .2s}
.atitle:hover{background:var(--bg2);box-shadow:-12px 0 0 var(--bg2),12px 0 0 var(--bg2)}
.atitle:focus{outline:none;background:var(--bg2);box-shadow:-12px 0 0 var(--bg2),12px 0 0 var(--bg2),0 0 0 4px rgba(0,113,227,.35)}
.atitle::placeholder{color:#c7c7cc}
.ameta{color:var(--sub);font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
.tile{position:relative;aspect-ratio:1;margin:0;border-radius:18px;overflow:hidden;background:#e5e5ea;cursor:zoom-in;transition:transform .35s var(--ease),box-shadow .35s}
.tile:hover{transform:scale(1.02);box-shadow:0 14px 34px rgba(0,0,0,.16);z-index:1}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .badge{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;background:rgba(255,255,255,.74);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:980px;padding:2px 11px;font-size:13px;font-weight:500}
.tile .del{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:0;border-radius:980px;padding:2px 12px;font-size:13px;color:var(--red);opacity:0;transition:opacity .2s}
.tile:hover .del,.tile .del:focus-visible{opacity:1}
@media(hover:none){.tile .del{opacity:1}}

/* 上传 */
.upload{padding:96px 0 0}
.up-card{background:var(--bg2);border-radius:32px;padding:clamp(20px,4vw,40px)}
.drop{background:#fff;border-radius:24px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:32px;transition:box-shadow .25s,transform .25s}
.drop:hover{box-shadow:0 12px 40px rgba(0,0,0,.08)}
.drop.over{box-shadow:0 0 0 4px rgba(0,113,227,.45);transform:scale(1.01)}
.drop svg{width:56px;height:56px;stroke:var(--blue);margin-bottom:14px}
.drop strong{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.drop span{color:var(--sub);font-size:16px;margin-top:8px}
.staging{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.staging:empty{display:none}
.chip{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;background:#e5e5ea}
.chip img{width:100%;height:100%;object-fit:cover;display:block}
.chip .x{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:14px;line-height:1}
.chip .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--blue);width:0;transition:width .15s}
.chip.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(52,199,89,.88);color:#fff;font-size:26px}
.chip.fail::after{content:"!";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,59,48,.88);color:#fff;font-size:26px}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub)}
.field.grow{flex:1 1 280px}
.inp,input[type=date],textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:0;border-radius:12px;padding:12px 14px;transition:box-shadow .2s}
.inp:focus,input[type=date]:focus,textarea:focus{outline:none;box-shadow:0 0 0 4px rgba(0,113,227,.3)}
textarea{resize:vertical;min-height:46px}
.opts{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
.opt{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#d1d1d6;position:relative;cursor:pointer;transition:background .25s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(18px)}
.status{margin-top:14px;font-size:15px;min-height:22px;color:var(--sub)}
.status.err{color:var(--red)}

footer{margin-top:96px;background:var(--bg2);border-top:1px solid var(--line);padding:26px 0 34px;text-align:center;font-size:13px;color:var(--faint)}

/* 灯箱：Quick Look 风格 */
.lb{position:fixed;inset:0;z-index:60;background:rgba(245,245,247,.82);-webkit-backdrop-filter:saturate(180%) blur(40px);backdrop-filter:saturate(180%) blur(40px);display:none;overflow:auto;opacity:0;transition:opacity .3s var(--ease)}
.lb.show{display:block}
.lb.vis{opacity:1}
.lb-body{display:grid;grid-template-columns:1fr 392px;gap:16px;height:100vh;padding:16px}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:24px 56px}
.lb-stage img{max-width:100%;max-height:100%;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
.circ{position:absolute;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.75);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.12);display:grid;place-items:center;font-size:20px;line-height:1;padding:0;transition:background .2s,transform .2s}
.circ:hover{background:#fff;transform:scale(1.06)}
.lb-close{top:8px;left:8px;font-size:16px}
.lb-nav{top:50%;margin-top:-20px}
.lb-nav.prev{left:6px}.lb-nav.next{right:6px}
.lb-side{display:flex;flex-direction:column;background:rgba(255,255,255,.74);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:26px;padding:26px 24px 22px;overflow:auto;box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 10px 40px rgba(0,0,0,.08)}
.lb-count{font-size:13px;color:var(--faint);font-weight:500}
.lb-cap{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.25;margin:6px 0 20px;white-space:pre-wrap;word-break:break-word}
.lb-cap.none{color:#c7c7cc}
.rate{background:var(--bg2);border-radius:18px;padding:16px 18px;margin-bottom:22px}
.rate .lab{font-size:13px;color:var(--sub);margin-bottom:4px}
.stars{display:flex;gap:2px}
.star{background:none;border:0;padding:0 1px;font-size:34px;line-height:1.1;color:#d1d1d6;transition:color .15s,transform .2s var(--ease)}
.star.on{color:var(--star)}
.star:hover{transform:scale(1.15)}
.rate .avg{font-size:13px;color:var(--sub);margin-top:6px}
.cm-title{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.cms{flex:1;min-height:70px}
.cm{padding:12px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm .who{display:flex;justify-content:space-between;font-size:13px;color:var(--faint)}
.cm .who b{color:var(--ink);font-weight:600}
.cm .who button{background:none;border:0;color:var(--faint);font-size:13px;padding:0}
.cm .who button:hover{color:var(--red)}
.cm p{margin:3px 0 0;font-size:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.cm-empty{color:var(--faint);font-size:15px;padding:12px 0}
.cm-form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.cm-form .inp,.cm-form textarea{background:var(--bg2)}
.cm-form .btn{align-self:flex-end;padding:9px 22px;font-size:15px}
.lb-warn{font-size:13px;color:var(--red);margin-top:10px}

@media(max-width:960px){
  .hero{padding-top:56px}
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:clamp(170px,42vw,260px);gap:12px}
  .bc.big,.bc.wide{grid-column:span 2}
  .bc.big{grid-row:span 2}
  .band{padding:64px 0 72px;margin-top:64px}
  .hero-card{aspect-ratio:4/3;border-radius:24px}
  .lb-body{grid-template-columns:1fr;height:auto;min-height:100%}
  .lb-stage{height:58vh;padding:56px 14px 8px}
  .lb-nav.prev{left:4px}.lb-nav.next{right:4px}
}
@media(max-width:560px){.wrap{padding:0 16px}.bc{border-radius:22px}.bc .tx{left:16px;bottom:14px}.bc h3{font-size:18px}.bc.big h3{font-size:26px}.tiles{grid-template-columns:repeat(2,1fr);gap:6px}.tile{border-radius:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="#/">日常记录</a>
  <div class="nav-r"><a href="#/">相册</a><button class="pill" id="navUp">上传</button></div>
</div></nav>

<main>
  <div class="wrap"><div class="warn" id="warn">还没配置 Supabase。请打开本文件，在 <code>&lt;script&gt;</code> 顶部填入 <code>SUPABASE_URL</code> 和 <code>SUPABASE_ANON_KEY</code>。</div></div>

  <!-- 首页 -->
  <section id="homeView">
    <div class="hero">
      <h1 class="rv">日常记录</h1>
      <p class="lead rv">把每一天，存成一本相册。</p>
      <div class="cta rv"><a class="btn" id="heroBtn" href="#/">翻开最新相册</a><button class="link" id="heroUp">上传照片 ›</button></div>
      <div class="hero-stage rv" id="heroSide"></div>
    </div>
    <div class="band">
      <div class="wrap">
        <div class="sec"><h2>全部相册</h2><span id="albumCount"></span></div>
        <div class="bento" id="albums"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </section>

  <!-- 相册详情 -->
  <section id="albumView" hidden>
    <div class="wrap">
      <button class="back" id="backBtn">‹ 相册</button>
      <div class="ahead">
        <div class="adate" id="aDate"></div>
        <input class="atitle" id="aTitle" type="text" maxlength="40" placeholder="给这本相册起个名字" aria-label="相册标题">
        <div class="ameta" id="aMeta"></div>
      </div>
      <div class="tiles" id="shots"></div>
    </div>
  </section>

  <!-- 上传 -->
  <section class="upload" id="upload">
    <div class="wrap">
      <div class="sec"><h2>添加照片</h2><span id="upHint"></span></div>
      <div class="up-card">
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入图片">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="M3.5 17l5-4.5 3.5 3 3-2.5 5.5 4.5"/></svg>
          <strong>拖入照片</strong>
          <span>或点击选择，支持多张，也可以直接粘贴截图</span>
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <div class="staging" id="staging"></div>
        <div class="row">
          <label class="field">归档日期<input type="date" id="date"></label>
          <label class="field grow">文字说明（可选，会附在这一批照片上）<textarea id="caption" rows="1" placeholder="写点什么……"></textarea></label>
          <button class="btn" id="go" disabled>上传</button>
        </div>
        <div class="opts">
          <label class="opt"><input class="sw" type="checkbox" id="auto" checked>拖入后立即上传</label>
          <label class="opt"><input class="sw" type="checkbox" id="compress" checked>自动压缩，节省空间</label>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>
    </div>
  </section>
</main>

<footer>何岩制作</footer>

<!-- 灯箱 -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-body">
    <div class="lb-stage">
      <button class="circ lb-close" id="lbClose" aria-label="关闭">✕</button>
      <button class="circ lb-nav prev" id="lbPrev" aria-label="上一张">‹</button>
      <img id="lbImg" alt="">
      <button class="circ lb-nav next" id="lbNext" aria-label="下一张">›</button>
    </div>
    <aside class="lb-side">
      <div class="lb-count" id="lbCount"></div>
      <div class="lb-cap" id="lbCap"></div>
      <div class="rate">
        <div class="lab" id="rateLab">给这张照片打分</div>
        <div class="stars" id="stars"></div>
        <div class="avg" id="avg"></div>
      </div>
      <div class="cm-title">留言</div>
      <div class="cms" id="cms"></div>
      <form class="cm-form" id="cmForm" onsubmit="return false">
        <input class="inp" type="text" id="cmName" maxlength="20" placeholder="你的名字">
        <textarea id="cmBody" rows="3" maxlength="500" placeholder="写下你的留言……"></textarea>
        <button class="btn" id="cmSend" type="button">发布</button>
      </form>
      <div class="lb-warn" id="lbWarn" hidden>评分和留言功能还没启用：请在 Supabase 的 SQL Editor 里执行新增的建表 SQL。</div>
    </aside>
  </div>
</div>

<script>
/* ========== 只需要改这里 ========== */
const SUPABASE_URL = "https://suqynjllyqxxenhohmqk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cXluamxseXF4eGVuaG9obXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjUwMzUsImV4cCI6MjEwNzM0MTAzNX0.Utj1lmHnUG1atycIyX6mSMW1B6TA9WWfhP_MfmoZ7AI";
const BUCKET = "photos";
const TABLE = "photos";
const FULL_MAX = 2560, FULL_Q = 0.88;   // 大图最长边 / 质量
const THUMB_MAX = 960, THUMB_Q = 0.8;   // 缩略图最长边 / 质量
/* ================================== */

const configured = !SUPABASE_URL.includes("你的") && !SUPABASE_ANON_KEY.includes("你的");
const H = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const enc = path => path.split("/").map(encodeURIComponent).join("/");
const pubUrl = path => `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${enc(path)}`;
const thumbPath = path => "t/" + path.replace(/\.[^./]+$/, "") + ".jpg";
const tUrl = path => pubUrl(thumbPath(path));
function thumbImg(path, alt){ return `<img src="${tUrl(path)}" data-full="${pubUrl(path)}" alt="${esc(alt || "")}" loading="lazy" onerror="this.onerror=null;this.src=this.dataset.full">`; }
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function nd(s){ const [y,m,d] = s.split("-").map(Number); const w = WEEK[new Date(y,m-1,d).getDay()]; return { long: `${y} 年 ${m} 月 ${d} 日 ${w}`, short: `${m} 月 ${d} 日` }; }
function fmtTime(iso){ const t = new Date(iso); return `${t.getMonth()+1}月${t.getDate()}日 ${pad(t.getHours())}:${pad(t.getMinutes())}`; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } }
let _tmp; function vid(){ let v = store("dr_vid") || _tmp; if (!v) { v = crypto.randomUUID ? crypto.randomUUID() : "v" + Math.random().toString(36).slice(2) + Date.now(); store("dr_vid", v); _tmp = v; } return v; }

async function api(path, opt = {}){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opt, headers: { ...H, "Content-Type": "application/json", ...(opt.headers || {}) } });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

/* ---------- 入场动画 ---------- */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08, rootMargin: "0px 0px -30px 0px" }) : null;
function reveal(){ document.querySelectorAll(".rv:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in")); }
window.addEventListener("scroll", () => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.querySelector(".hero-card"); if (!c) return;
  const y = Math.min(window.scrollY, 700); c.style.transform = `scale(${1 - y / 700 * 0.05})`;
}, { passive: true });

/* ---------- 数据 ---------- */
let photos = [], titles = {}, ratingsBy = {}, commentsBy = {}, extrasOk = true, albums = [];
function indexRatings(rows){ ratingsBy = {}; rows.forEach(r => { const o = ratingsBy[r.photo_id] ||= { sum: 0, n: 0, mine: 0 }; o.sum += r.score; o.n++; if (r.visitor_id === vid()) o.mine = r.score; }); }
function indexComments(rows){ commentsBy = {}; rows.forEach(c => (commentsBy[c.photo_id] ||= []).push(c)); }
function buildAlbums(){
  const m = new Map();
  photos.forEach(p => { if (!m.has(p.photo_date)) m.set(p.photo_date, []); m.get(p.photo_date).push(p); });
  albums = [...m].map(([date, list]) => {
    const asc = list.slice().sort((a,b) => a.created_at < b.created_at ? -1 : 1);
    let s = 0, n = 0; asc.forEach(p => { const o = ratingsBy[p.id]; if (o){ s += o.sum; n += o.n; } });
    return { date, photos: asc, title: titles[date] || "", cover: asc[0], avg: n ? s / n : 0, rc: n };
  }).sort((a,b) => a.date < b.date ? 1 : -1);
}
async function load(){
  if (!configured){ $("albums").innerHTML = `<div class="empty">配置 Supabase 后，这里会出现你的相册。</div>`; renderHero(); reveal(); return; }
  try {
    extrasOk = true;
    const soft = p => api(p).catch(e => { console.warn(p, e); extrasOk = false; return []; });
    const [p, a, r, c] = await Promise.all([
      api(`${TABLE}?select=*&order=photo_date.desc,created_at.desc`),
      soft("albums?select=*"), soft("ratings?select=photo_id,score,visitor_id"), soft("comments?select=*&order=created_at.asc")
    ]);
    photos = p; titles = {}; a.forEach(x => titles[x.album_date] = x.title || "");
    indexRatings(r); indexComments(c); buildAlbums(); route();
  } catch (e) {
    console.error(e);
    $("albums").innerHTML = `<div class="empty">读取失败，请检查 URL / Key，以及是否已执行建表 SQL。</div>`;
  }
}

/* ---------- 路由 ---------- */
let curDate = null;
function route(){
  const m = location.hash.match(/^#\/album\/(\d{4}-\d{2}-\d{2})/);
  if (m && albums.find(a => a.date === m[1])) showAlbum(m[1]); else showHome();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
$("backBtn").onclick = () => { location.hash = "#/"; };
const toUpload = () => $("upload").scrollIntoView({ behavior: "smooth" });
$("navUp").onclick = toUpload; $("heroUp").onclick = toUpload;

function showHome(){
  curDate = null;
  $("homeView").hidden = false; $("albumView").hidden = true;
  $("date").value = todayStr(); $("upHint").textContent = "";
  renderHero(); renderAlbums(); reveal();
}
function renderHero(){
  const a = albums[0], side = $("heroSide");
  if (!a){ side.innerHTML = `<div class="hero-card"><div class="hero-empty">等待第一张照片</div></div>`; $("heroBtn").style.display = "none"; return; }
  $("heroBtn").style.display = ""; $("heroBtn").href = `#/album/${a.date}`;
  side.innerHTML = `<a class="hero-card" href="#/album/${a.date}"><img src="${pubUrl(a.cover.storage_path)}" alt=""><span class="hero-tag">最新相册　${esc(a.title || nd(a.date).short)}</span></a>`;
}
function renderAlbums(){
  const root = $("albums");
  $("albumCount").textContent = albums.length ? `共 ${albums.length} 本` : "";
  if (!albums.length){ root.innerHTML = `<div class="empty">还没有相册，把第一张照片拖进下面的框里吧。</div>`; return; }
  root.innerHTML = albums.map((a, i) => {
    const k = i % 6, cls = k === 0 ? "big" : k === 5 ? "wide" : "", d = nd(a.date);
    return `<a class="bc rv ${cls}" href="#/album/${a.date}">${thumbImg(a.cover.storage_path)}
      <span class="chip-t">${a.photos.length} 张</span>${a.rc ? `<span class="chip-t r">★ ${a.avg.toFixed(1)}</span>` : ""}
      <div class="tx"><h3>${esc(a.title || d.short)}</h3><div class="dt">${d.long}</div></div></a>`;
  }).join("");
}

function showAlbum(date){
  const a = albums.find(x => x.date === date); if (!a) return showHome();
  curDate = date;
  $("homeView").hidden = true; $("albumView").hidden = false;
  $("date").value = date; $("upHint").textContent = `将存入 ${nd(date).short} 的相册`;
  const d = nd(date);
  $("aDate").textContent = d.long;
  $("aTitle").value = a.title; $("aTitle").placeholder = d.short;
  $("aMeta").textContent = `${a.photos.length} 张照片` + (a.rc ? `，平均 ${a.avg.toFixed(1)} 分` : "");
  const root = $("shots"); root.innerHTML = "";
  a.photos.forEach((p, i) => {
    const o = ratingsBy[p.id], cm = (commentsBy[p.id] || []).length;
    const f = document.createElement("figure"); f.className = "tile";
    f.innerHTML = thumbImg(p.storage_path, p.caption) +
      ((o || cm) ? `<div class="badge">${o ? `<span style="color:#c97800">★ ${(o.sum / o.n).toFixed(1)}</span>` : ""}${cm ? `<span>留言 ${cm}</span>` : ""}</div>` : "") +
      `<button class="del">删除</button>`;
    f.onclick = e => { if (e.target.closest(".del")) return; openLb(a.photos, i); };
    f.querySelector(".del").onclick = () => removePhoto(p);
    root.appendChild(f);
  });
}
$("aTitle").addEventListener("change", async e => {
  if (!curDate) return;
  const title = e.target.value.trim();
  try {
    await api("albums?on_conflict=album_date", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ album_date: curDate, title }) });
    titles[curDate] = title; buildAlbums();
  } catch (err) { console.error(err); setStatus("相册标题保存失败，请先执行新增的建表 SQL。", true); }
});
$("aTitle").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

async function removePhoto(p){
  if (!confirm("确定删除这张照片？它的评分和留言也会一并删除。")) return;
  try {
    const a = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${p.storage_path}`, { method: "DELETE", headers: H });
    fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${thumbPath(p.storage_path)}`, { method: "DELETE", headers: H }).catch(() => {});
    const b = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${p.id}`, { method: "DELETE", headers: H });
    if (!a.ok || !b.ok) throw new Error("delete failed");
    const stay = curDate; await load();
    if (stay && !albums.find(x => x.date === stay)) location.hash = "#/";
  } catch (e) { console.error(e); setStatus("删除失败，请检查是否执行了包含 delete 权限的 SQL。", true); }
}

/* ---------- 灯箱：大图 / 评分 / 留言 ---------- */
let lbList = [], lbIdx = 0;
function openLb(list, i){
  lbList = list; lbIdx = i; const lb = $("lb");
  lb.classList.add("show"); document.body.style.overflow = "hidden"; $("lbWarn").hidden = extrasOk; renderLb();
  requestAnimationFrame(() => lb.classList.add("vis"));
}
function closeLb(){
  const lb = $("lb"); lb.classList.remove("vis");
  setTimeout(() => { lb.classList.remove("show"); document.body.style.overflow = ""; }, 280);
  if (curDate) showAlbum(curDate); else renderAlbums();
}
$("lbClose").onclick = closeLb;
$("lbPrev").onclick = () => stepLb(-1);
$("lbNext").onclick = () => stepLb(1);
function stepLb(d){ lbIdx = (lbIdx + d + lbList.length) % lbList.length; renderLb(); }
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("show")) return;
  if (e.key === "Escape") closeLb();
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});
function renderLb(){
  const p = lbList[lbIdx];
  const img = $("lbImg"); img.src = tUrl(p.storage_path);   // 先显示缩略图，立即有画面
  const full = new Image(); full.onload = () => { if (lbList[lbIdx] === p) img.src = full.src; }; full.src = pubUrl(p.storage_path);
  img.onerror = () => { img.onerror = null; img.src = pubUrl(p.storage_path); }; img.alt = p.caption || "";
  $("lbCount").textContent = `${lbIdx + 1} / ${lbList.length}`;
  const cap = $("lbCap"); cap.textContent = p.caption || "没有文字说明"; cap.className = "lb-cap" + (p.caption ? "" : " none");
  const multi = lbList.length > 1; $("lbPrev").style.display = $("lbNext").style.display = multi ? "" : "none";
  renderRate(p); renderComments(p);
  if (!$("cmName").value) $("cmName").value = store("dr_name") || "";
}
function renderRate(p){
  const o = ratingsBy[p.id] || { sum: 0, n: 0, mine: 0 };
  const box = $("stars"); box.innerHTML = "";
  for (let i = 1; i <= 5; i++){
    const b = document.createElement("button"); b.className = "star" + (i <= o.mine ? " on" : ""); b.textContent = "★"; b.setAttribute("aria-label", `${i} 分`);
    b.onmouseenter = () => [...box.children].forEach((c, k) => c.classList.toggle("on", k < i));
    b.onclick = () => rate(p, i);
    box.appendChild(b);
  }
  box.onmouseleave = () => [...box.children].forEach((c, k) => c.classList.toggle("on", k < o.mine));
  $("rateLab").textContent = o.mine ? `你的评分：${o.mine} 分（点击可修改）` : "给这张照片打分";
  $("avg").textContent = o.n ? `平均 ${(o.sum / o.n).toFixed(1)} 分，共 ${o.n} 人评分` : "还没有人评分";
}
async function rate(p, score){
  try {
    await api("ratings?on_conflict=photo_id,visitor_id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ photo_id: p.id, visitor_id: vid(), score }) });
    const rows = await api(`ratings?select=photo_id,score,visitor_id&photo_id=eq.${p.id}`);
    const o = { sum: 0, n: 0, mine: 0 }; rows.forEach(r => { o.sum += r.score; o.n++; if (r.visitor_id === vid()) o.mine = r.score; });
    ratingsBy[p.id] = o; renderRate(p); buildAlbums();
  } catch (e) { console.error(e); $("lbWarn").hidden = false; }
}
function renderComments(p){
  const list = commentsBy[p.id] || [], box = $("cms");
  if (!list.length){ box.innerHTML = `<div class="cm-empty">还没有留言，来写第一条吧。</div>`; return; }
  box.innerHTML = list.map(c => `<div class="cm"><div class="who"><span><b>${esc(c.author || "匿名")}</b>　${fmtTime(c.created_at)}</span>${c.visitor_id === vid() ? `<button data-id="${c.id}">删除</button>` : ""}</div><p>${esc(c.body)}</p></div>`).join("");
  box.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => delComment(p, b.dataset.id));
}
async function reloadComments(p){ commentsBy[p.id] = await api(`comments?select=*&photo_id=eq.${p.id}&order=created_at.asc`); renderComments(p); }
$("cmSend").onclick = async () => {
  const p = lbList[lbIdx], body = $("cmBody").value.trim(), author = $("cmName").value.trim() || "匿名";
  if (!body) return $("cmBody").focus();
  $("cmSend").disabled = true;
  try {
    await api("comments", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ photo_id: p.id, author, body, visitor_id: vid() }) });
    store("dr_name", author); $("cmBody").value = ""; await reloadComments(p);
  } catch (e) { console.error(e); $("lbWarn").hidden = false; }
  $("cmSend").disabled = false;
};
async function delComment(p, id){
  if (!confirm("删除这条留言？")) return;
  try { await api(`comments?id=eq.${id}`, { method: "DELETE" }); await reloadComments(p); } catch (e) { console.error(e); }
}

/* ---------- 上传（含压缩与缩略图） ---------- */
let staged = [], busy = false;
const drop = $("drop");
$("date").value = todayStr();
if (!configured) $("warn").style.display = "block";
drop.onclick = () => $("file").click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());
window.addEventListener("paste", e => { if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; const fs = [...(e.clipboardData?.files || [])]; if (fs.length) addFiles(fs); });

function addFiles(list){
  const imgs = [...list].filter(f => f.type.startsWith("image/"));
  if (!imgs.length) return setStatus("只支持图片文件。", true);
  for (const file of imgs){
    const url = URL.createObjectURL(file);
    const el = document.createElement("div"); el.className = "chip";
    el.innerHTML = `<img src="${url}" alt=""><button class="x" aria-label="移除">×</button><div class="bar"></div>`;
    const item = { file, url, el };
    el.querySelector(".x").onclick = () => { staged = staged.filter(s => s !== item); el.remove(); URL.revokeObjectURL(url); refreshBtn(); };
    staged.push(item); $("staging").appendChild(el);
  }
  refreshBtn();
  if ($("auto").checked) upload();
}
function refreshBtn(){ $("go").disabled = busy || !staged.length; $("go").textContent = staged.length ? `上传 ${staged.length} 张` : "上传"; }
function setStatus(msg, err){ const s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : ""); }
$("go").onclick = upload;

function loadImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => res({ im, u }); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("无法读取图片")); }; im.src = u;
  });
}
async function toJpeg(file, max, q){
  const { im, u } = await loadImg(file);
  const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);
  URL.revokeObjectURL(u);
  const b = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  if (!b) throw new Error("压缩失败"); return b;
}
function xhrUpload(path, file, onProgress){
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${enc(path)}`);
    x.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    x.setRequestHeader("Authorization", "Bearer " + SUPABASE_ANON_KEY);
    x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    x.setRequestHeader("x-upsert", "false");
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => x.status < 300 ? resolve() : reject(new Error(x.responseText || x.status));
    x.onerror = () => reject(new Error("网络错误"));
    x.send(file);
  });
}
const extOf = f => ((f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";

async function upload(){
  if (busy || !staged.length) return;
  if (!configured) return setStatus("请先在文件顶部配置 Supabase。", true);
  const date = $("date").value || todayStr(), caption = $("caption").value.trim(), doCompress = $("compress").checked;
  busy = true; refreshBtn();
  const batch = staged.slice(); let ok = 0, fail = 0, before = 0, after = 0;
  for (let i = 0; i < batch.length; i++){
    const it = batch[i], f = it.file; setStatus(`正在处理并上传 ${i + 1} / ${batch.length}…`);
    try {
      let full = f, ext = extOf(f), thumb = null;
      if (f.type !== "image/gif" && f.type !== "image/svg+xml"){
        try {
          thumb = await toJpeg(f, THUMB_MAX, THUMB_Q);
          if (doCompress){ const b = await toJpeg(f, FULL_MAX, FULL_Q); if (b.size < f.size){ full = b; ext = "jpg"; } }
        } catch (e) { console.warn("压缩跳过：", e); }
      }
      const path = `${date}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      await xhrUpload(path, full, p => it.el.querySelector(".bar").style.width = (p * 100) + "%");
      if (thumb) await xhrUpload(thumbPath(path), thumb, () => {}).catch(e => console.warn("缩略图上传失败", e));
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, { method: "POST", headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify({ photo_date: date, storage_path: path, caption: caption || null }) });
      if (!r.ok) throw new Error(await r.text());
      before += f.size; after += full.size + (thumb ? thumb.size : 0);
      it.el.classList.add("done"); ok++; staged = staged.filter(s => s !== it);
      setTimeout(() => { it.el.remove(); URL.revokeObjectURL(it.url); }, 900);
    } catch (e) { console.error(e); it.el.classList.add("fail"); fail++; }
  }
  busy = false; refreshBtn();
  if (ok){ $("caption").value = ""; await load(); }
  const mb = n => (n / 1048576).toFixed(1);
  setStatus(fail ? `完成：成功 ${ok} 张，失败 ${fail} 张（红色标记的可重试，详情见浏览器控制台）。`
                 : `已存入 ${nd(date).long} 的相册，共 ${ok} 张，占用空间 ${mb(after)} MB（原图 ${mb(before)} MB）。`, !!fail);
}

refreshBtn();
reveal();
load();
</script>
</body>
